<div class="w-full flex flex-col space-y-1.5" [dir]="direction()" [class.text-right]="direction() === 'rtl'" [class.text-left]="direction() === 'ltr'">
  @if (label()) {
    <label [for]="inputId()" class="text-[13px] font-medium text-bosla-charcoal/80 block">
      {{ label() }}
      @if (required()) {
        <span class="text-bosla-error me-0.5" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="relative">
    <select
      [id]="inputId()"
      [disabled]="disabled()"
      [value]="value()"
      (change)="onSelectChange($event)"
      (blur)="onBlur()"
      class="block w-full h-11 px-3 text-[14px] font-sans bg-bosla-offwhite border rounded-xl transition-all duration-200 outline-none appearance-none cursor-pointer disabled:bg-bosla-charcoal/5 disabled:text-bosla-charcoal/40 disabled:cursor-not-allowed"
      [class]="errorMessage() 
        ? 'border-bosla-error text-bosla-error focus:border-bosla-error focus:ring-2 focus:ring-bosla-error/10' 
        : 'border-bosla-charcoal/10 text-bosla-charcoal focus:border-bosla-blue focus:ring-2 focus:ring-bosla-blue/10'"
    >
      @if (placeholder()) {
        <option value="" disabled selected>{{ placeholder() }}</option>
      }
      @for (option of options(); track option.value) {
        <option [value]="option.value" [disabled]="option.disabled">
          {{ option.label }}
        </option>
      }
    </select>

    <div class="pointer-events-none absolute inset-y-0 end-0 flex items-center px-3 text-bosla-charcoal/30">
      <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </div>
  </div>

  @if (errorMessage()) {
    <p class="text-[13px] font-sans text-bosla-error mt-0.5 flex items-center gap-1">
      <i class="fa-solid fa-circle-exclamation text-xs"></i>
      {{ errorMessage() }}
    </p>
  }
</div>
