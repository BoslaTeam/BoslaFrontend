<style>
  .card-premium {
    background: white;
    border-radius: 2rem;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(27, 79, 114, 0.04);
    border: 1px solid rgba(27, 79, 114, 0.08);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    height: 100%;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    position: relative;
  }
  .card-premium:hover {
    transform: translateY(-10px);
    box-shadow: 0 20px 40px rgba(27, 79, 114, 0.12), 0 0 0 2px rgba(243, 156, 18, 0.4);
  }
  .card-premium-header {
    height: 120px;
    background: linear-gradient(135deg, #1B4F72 0%, #2E86AB 100%);
    position: relative;
    overflow: hidden;
  }
  .card-premium-header::after {
    content: '';
    position: absolute;
    top: 0; left: -150%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transform: skewX(-20deg);
    animation: shimmer-card 4s infinite;
  }
  @keyframes shimmer-card {
    0% { left: -150%; }
    20% { left: 200%; }
    100% { left: 200%; }
  }
</style>

<div class="card-premium group" dir="rtl" (click)="onCardClick()">
  <!-- Header -->
  <div class="card-premium-header">
    @if (expert().isVerified) {
      <div class="absolute top-4 right-4 bg-white/95 backdrop-blur-sm text-[#1B4F72] text-xs font-black px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-lg z-10">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" class="w-3.5 h-3.5 text-[#F39C12]">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z"/>
        </svg>
        <span>موثّق</span>
      </div>
    }

  </div>

  <!-- Avatar -->
  <div class="absolute top-16 left-1/2 -translate-x-1/2 w-24 h-24 bg-white rounded-full p-1.5 shadow-[0_8px_20px_rgba(0,0,0,0.15)] z-20 group-hover:scale-105 transition-transform duration-300">
    <img [src]="expert().avatarUrl" [alt]="expert().name" class="w-full h-full rounded-full object-cover" />
    <!-- Online Status -->
    <div class="absolute bottom-1 right-1 w-5 h-5 rounded-full border-[3px] border-white"
         [class.bg-[#10B981]]="expert().isOnline" 
         [class.shadow-[0_0_0_4px_rgba(16,185,129,0.2)]]="expert().isOnline"
         [class.bg-slate-400]="!expert().isOnline">
    </div>
  </div>

  <!-- Body -->
  <div class="flex-grow pt-14 pb-6 px-6 text-center flex flex-col">
    <h3 class="text-xl font-black text-[#1B4F72] mb-1 group-hover:text-[#F39C12] transition-colors">{{ expert().name }}</h3>
    <p class="text-sm font-semibold text-slate-500 mb-6 line-clamp-2 leading-relaxed">{{ expert().title }}</p>
    
    <!-- Footer -->
    <div class="mt-auto pt-4 border-t border-slate-100 flex items-center justify-between">
      <div class="flex items-center gap-1.5 bg-[#F39C12]/10 px-3 py-1.5 rounded-xl">
        <svg viewBox="0 0 20 20" class="w-4 h-4 text-[#F39C12]" fill="currentColor">
          <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
        </svg>
        <span class="font-bold text-[#1B4F72] text-sm">{{ expert().rating | number:'1.1-1' }}</span>
      </div>
      
      <div class="text-[#1B4F72] font-black text-lg">
        {{ expert().price }} <span class="text-xs text-slate-400 font-medium">ج.م/س</span>
      </div>
    </div>
  </div>
</div>
