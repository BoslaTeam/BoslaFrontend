<div class="w-full bg-white border border-slate-100 p-5 rounded-3xl shadow-sm hover:shadow-md hover:-translate-y-2 transition-all duration-300 flex items-center justify-between gap-4 cursor-pointer group"
    dir="rtl" (click)="onCardClick()">

    <div class="flex items-center gap-4 min-w-0">

        <!-- Avatar -->
        <div class="relative shrink-0">

            <div class="w-18 h-18 rounded-xl overflow-hidden border-2 border-slate-50">
                <img [src]="expert().avatarUrl" [alt]="expert().name" class="w-full h-full object-cover" />
            </div>

            <!-- Online Status Indicator -->
            <span class="absolute bottom-0.5 left-0.5 w-3.5 h-3.5 rounded-full border-2 border-white"
                [class.bg-emerald-500]="expert().isOnline" [class.bg-slate-400]="!expert().isOnline">
            </span>

        </div>

        <!-- Content -->
        <div class="flex flex-col gap-1 min-w-0">

            <!-- Name -->
            <div class="flex items-center gap-2 flex-wrap">

                <h3 class="text-[18px] font-bold text-bosla-primary truncate">
                    {{ expert().name }}
                </h3>

                @if (expert().isVerified) {
                <span
                    class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-green-50 text-green-600 text-[11px] font-bold">
                    <i class="fa-solid fa-circle-check text-[10px]"></i>
                    موثق
                </span>
                }

            </div>

            <!-- Online Status -->
            <!-- <div class="flex items-center gap-1 text-xs">

                <span class="w-2 h-2 rounded-full" [class.bg-emerald-500]="expert().isOnline"
                    [class.bg-slate-400]="!expert().isOnline">
                </span>

                <span class="font-medium" [class.text-emerald-600]="expert().isOnline"
                    [class.text-slate-500]="!expert().isOnline">

                    {{ expert().isOnline ? 'متصل الآن' : 'غير متصل' }}

                </span>

            </div> -->

            <!-- Title -->
            <p class="text-[14px] text-slate-500 truncate">
                {{ expert().title }}
            </p>

            <!-- Price -->
            <p class="text-[15px] font-bold text-slate-500 mt-1">
                <span class="text-bosla-primary font-black">
                    {{ expert().price }}
                </span>
                ر.س / ساعة
            </p>

        </div>

    </div>

    <!-- Rating -->
    <div
        class="bg-slate-50 border border-slate-100 text-slate-700 px-2.5 py-1 rounded-lg flex items-center gap-1 text-[13px] font-bold shrink-0">

        <span>{{ expert().rating | number:'1.1-1' }}</span>

        <i class="fa-solid fa-star text-bosla-orange text-[11px]"></i>

    </div>

</div>
