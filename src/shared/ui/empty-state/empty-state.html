<div class="w-full max-w-lg mx-auto text-center flex flex-col items-center justify-center font-sans" [dir]="direction()">

  @if (icon()) {
  <div
    class="w-24 h-24 rounded-3xl bg-bosla-offwhite border border-slate-200 flex items-center justify-center mb-6 shadow-sm">

    <i [class]="icon()" class="text-4xl text-bosla-orange">
    </i>

  </div>
  }

  <h3 class="text-2xl font-black text-bosla-primary mb-3">
    {{ title() }}
  </h3>

  @if (description()) {
  <p class="text-bosla-charcoal/70 leading-relaxed max-w-md mx-auto">
    {{ description() }}
  </p>
  }

  <div class="mt-8 flex items-center justify-center">
    <ng-content />
  </div>

</div>
