<div
  class="w-full bg-white border border-bosla-charcoal/10 rounded-md p-8 sm:p-12 flex flex-col items-center justify-center text-center max-w-sm mx-auto animate-fadeIn"
  dir="rtl">

  @if (icon()) {
  <div
    class="w-20 h-20 bg-bosla-primary/10 rounded-xl flex items-center justify-center text-bosla-primary text-3xl mb-5 select-none"
    aria-hidden="true">
    <i [class]="icon()"></i>
  </div>
  }

  <h3 class="text-[18px] font-bold text-bosla-primary font-sans leading-snug">
    {{ title() }}
  </h3>

  @if (description()) {
  <p class="mt-2 text-[14px] text-bosla-charcoal/70 font-sans max-w-xs mx-auto leading-relaxed">
    {{ description() }}
  </p>
  }

  <div class="mt-6 w-full flex items-center justify-center">
    <ng-content />
  </div>

</div>
