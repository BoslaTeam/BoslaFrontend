<div class="flex flex-col items-center justify-center text-center p-8 sm:p-12 max-w-md mx-auto animate-fade-in">
  
  @if (icon()) {
    <div class="text-slate-400 mb-4 text-5xl select-none" aria-hidden="true">
      {{ icon() }}
    </div>
  }

  <h3 class="text-base font-semibold text-slate-900 tracking-tight">
    {{ title() }}
  </h3>

  @if (description()) {
    <p class="mt-1.5 text-sm text-slate-500 max-w-xs mx-auto">
      {{ description() }}
    </p>
  }

  <div class="mt-6 flex items-center justify-center">
    <ng-content />
  </div>

</div>
