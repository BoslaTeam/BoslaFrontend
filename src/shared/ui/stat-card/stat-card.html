<div class="w-full max-w-[320px] bg-white border border-bosla-charcoal/5 p-6 rounded-2xl shadow-sm flex items-center justify-between gap-4"
    [dir]="direction()">

    <div [class]="iconClasses()">
        <i [class]="icon()"></i>
    </div>

    <div class="flex flex-col gap-1" [class.text-right]="direction() === 'rtl'" [class.text-left]="direction() === 'ltr'">
        <span class="text-[14px] font-sans text-bosla-charcoal/50 font-medium">
            {{ title() }}
        </span>

        <h3 class="text-[28px] font-sans font-semibold text-bosla-primary leading-9">
            {{ value() }}
        </h3>
    </div>

</div>
