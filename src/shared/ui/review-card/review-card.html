<div class="w-full bg-white border border-slate-100 p-6 rounded-2xl shadow-[0_4px_20px_rgba(27,79,114,0.03)] hover:shadow-[0_8px_30px_rgba(27,79,114,0.08)] hover:-translate-y-1 hover:border-bosla-blue/30 transition-all duration-300 flex flex-col gap-4 select-none relative overflow-hidden group" [dir]="direction()">

    <!-- Subtle gradient background on hover -->
    <div class="absolute inset-0 bg-gradient-to-br from-bosla-primary/[0.02] to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"></div>

    <div class="flex items-start justify-between gap-4 w-full relative z-10">

        <div class="flex items-center gap-3.5">
            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-slate-100 to-slate-200 border-2 border-white shadow-sm overflow-hidden flex items-center justify-center shrink-0 relative">
                @if (review().avatarUrl) {
                <img [src]="review().avatarUrl" [alt]="review().authorName" class="w-full h-full object-cover" />
                } @else {
                <i class="fa-solid fa-user text-slate-400 text-lg"></i>
                }
            </div>

            <div class="flex flex-col items-start justify-center gap-1">
                <div class="flex items-center gap-1.5">
                    <h4 class="text-base font-black text-bosla-primary leading-none">
                        {{ review().authorName }}
                    </h4>
                    @if (review().isVerified) {
                    <i class="fa-solid fa-circle-check text-xs text-green-500" title="تقييم موثق"></i>
                    }
                </div>
                <div class="flex flex-row-reverse justify-end gap-0.5 text-bosla-orange text-xs drop-shadow-sm">
                    @for (star of stars(); track $index) {
                    <i class="fa-solid fa-star"></i>
                    }
                    @for (star of emptyStars(); track $index) {
                    <i class="fa-regular fa-star text-slate-300"></i>
                    }
                </div>
            </div>
        </div>

        <span class="inline-flex items-center gap-1 text-[11px] font-bold text-slate-400 bg-slate-50 px-2 py-1 rounded-md border border-slate-100 shrink-0">
            <i class="fa-regular fa-clock"></i> {{ review().timeAgo }}
        </span>

    </div>

    @if (review().comment) {
    <div class="relative z-10 mt-1">
        <i class="fa-solid fa-quote-right absolute -top-1 -right-1 text-4xl text-slate-100/60 -z-10 transform -rotate-12"></i>
        <p class="text-sm font-medium text-slate-600 leading-relaxed line-clamp-4 pr-2 border-r-2 border-bosla-orange/20" [class.text-right]="direction() === 'rtl'" [class.text-left]="direction() === 'ltr'">
            {{ review().comment }}
        </p>
    </div>
    }

</div>
