<button [type]="type()" [disabled]="isButtonDisabled()" [class]="buttonClasses()" (click)="onClick($event)">
  @if (loading()) {
    <span class="absolute flex items-center justify-center text-current">
      <ui-spinner [size]="size() === 'sm' ? 'sm' : 'md'"></ui-spinner>
    </span>
  }

  <span [class.opacity-0]="loading()" class="flex items-center justify-center gap-2 transition-opacity duration-200">
    <ng-content></ng-content>
  </span>
</button>
