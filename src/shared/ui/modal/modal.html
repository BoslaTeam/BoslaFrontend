@if (isOpen()) {
<div
  class="fixed inset-0 bg-bosla-charcoal/40 backdrop-blur-xs flex items-center justify-center z-50 transition-opacity duration-300"
  [dir]="direction()">

  <div
    class="w-full max-w-[550px] bg-white rounded-2xl shadow-xl border border-bosla-charcoal/10 overflow-hidden transform scale-100 transition-transform duration-300">

    <div class="bg-bosla-blue/5 px-6 py-4 flex items-center justify-between border-b border-bosla-blue/10">
      <h3 class="text-[18px] font-sans font-bold text-bosla-primary leading-tight">
        {{ title() }}
      </h3>
      <button type="button" (click)="onClose()"
        class="text-bosla-charcoal/40 hover:text-bosla-charcoal cursor-pointer transition-colors p-1 text-lg outline-none">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="p-6">
      <p class="text-[15px] font-sans text-bosla-charcoal/80 font-medium leading-relaxed" [class.text-right]="direction() === 'rtl'" [class.text-left]="direction() === 'ltr'">
        {{ message() }}
      </p>
    </div>

    <div class="px-6 pb-6 pt-2 flex items-center justify-start gap-4">
      <button type="button" (click)="onConfirm()"
        class="px-5 h-10 bg-bosla-error text-white font-sans font-bold text-[14px] rounded-xl hover:bg-bosla-error/90 active:scale-98 shadow-sm transition-all cursor-pointer outline-none">
        نعم، إلغاء
      </button>

      <button type="button" (click)="onClose()"
        class="px-4 h-10 text-bosla-charcoal/60 hover:text-bosla-charcoal font-sans font-medium text-[14px] transition-colors cursor-pointer outline-none">
        تراجع
      </button>
    </div>

  </div>
</div>
}
