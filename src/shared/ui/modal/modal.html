@if (open()) {
  <div 
    (click)="onBackdropClick()"
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-fade-in"
  >
    <div
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-modal="true"
      class="bg-white rounded-2xl shadow-xl border border-slate-100 flex flex-col w-full max-h-[90vh] overflow-hidden transform transition-all duration-300 scale-100"
      [class]="getSizeClasses()"
    >
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
        @if (title()) {
          <h2 class="text-lg font-semibold text-slate-900 tracking-tight">
            {{ title() }}
          </h2>
        } @else {
          <div></div>
        }
        
        <button 
          type="button" 
          (click)="close.emit()" 
          aria-label="Close modal"
          class="text-slate-400 hover:text-slate-600 hover:bg-slate-50 p-2 rounded-xl transition-colors duration-200 outline-none focus:ring-2 focus:ring-slate-200"
        >
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="px-6 py-5 overflow-y-auto text-sm text-slate-600 flex-1">
        <ng-content />
      </div>
    </div>
  </div>
}
