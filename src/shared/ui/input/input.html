<div class="w-full flex flex-col space-y-1" [dir]="direction()" [class.text-right]="direction() === 'rtl'" [class.text-left]="direction() === 'ltr'">
  @if (label()) {
  <label [for]="inputId()" class="text-[13px] font-medium text-bosla-charcoal/80 font-sans block">
    {{ label() }}
    @if (required()) {
    <span class="text-bosla-error me-0.5" aria-hidden="true">*</span>
    }
  </label>
  }

  <div class="relative flex items-center">
    <input [id]="inputId()" [type]="type()" [placeholder]="placeholder()" [disabled]="disabled()" [value]="value()"
      (input)="onInput($event)" (blur)="onBlur()"
      class="block w-full h-11 text-[14px] font-sans bg-bosla-offwhite border rounded-xl transition-all duration-200 outline-none disabled:bg-bosla-charcoal/5 disabled:text-bosla-charcoal/40 disabled:cursor-not-allowed"
      [class]="errorMessage() 
        ? 'border-bosla-error text-bosla-error placeholder-bosla-error/40 focus:border-bosla-error px-3' 
        : 'border-bosla-charcoal/10 text-bosla-charcoal placeholder-bosla-charcoal/40 focus:border-bosla-blue focus:ring-2 focus:ring-bosla-blue/10 px-3'"
      [class.pl-10]="type() === 'email'" />

    @if (type() === 'email') {
    <span
      class="absolute left-3 text-bosla-charcoal/40 select-none pointer-events-none flex items-center justify-center">
      <i class="fa-regular fa-envelope fa-lg"></i>
    </span>
    }
  </div>

  @if (errorMessage()) {
  <p class="text-[13px] font-sans text-bosla-error mt-0.5 flex items-center gap-1">
    <i class="fa-solid fa-circle-exclamation text-xs"></i>
    {{ errorMessage() }}
  </p>
  } @else if (hint()) {
  <p class="text-[13px] font-sans text-bosla-charcoal/60 mt-0.5">{{ hint() }}</p>
  }
</div>
