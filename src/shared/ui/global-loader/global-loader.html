<!-- Top Progress Bar -->
@if (showProgressBar()) {
  <div class="progress-bar-container" role="progressbar" aria-label="جاري التحميل">
    <div class="progress-bar"></div>
    <div class="progress-glow"></div>
  </div>
}

<!-- Full-Screen Route Loading Overlay -->
@if (showOverlay()) {
  <div class="loader-overlay" role="status" aria-label="جاري تحميل الصفحة">
    <div class="loader-content">
      <!-- Compass Animation -->
      <div class="compass-wrapper">
        <div class="compass-ring">
          <div class="compass-ring-inner"></div>
        </div>
        <div class="compass-needle-container">
          <div class="compass-needle">
            <div class="needle-north"></div>
            <div class="needle-south"></div>
          </div>
        </div>
        <div class="compass-center"></div>
        <!-- Cardinal Points -->
        <span class="cardinal cardinal-n">N</span>
        <span class="cardinal cardinal-e">E</span>
        <span class="cardinal cardinal-s">S</span>
        <span class="cardinal cardinal-w">W</span>
      </div>
      <p class="loader-text">جاري التوجيه<span class="dots-anim">...</span></p>
    </div>
  </div>
}
