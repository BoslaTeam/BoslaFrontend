<div class="fixed top-4 right-4 z-9999 flex flex-col space-y-3 w-full max-w-md pointer-events-none" dir="rtl">
    @for (toast of toastService.toasts(); track toast.id) {
    <div role="alert"
        class="pointer-events-auto flex items-center justify-between w-full min-h-14 p-4 rounded-xs border-y border-l transition-all duration-300 shadow-xs"
        [class]="getVariantClasses(toast.variant)">
        <div class="flex items-center gap-3 flex-1 min-w-0 text-right">
            <span class="text-base shrink-0 flex items-center justify-center" aria-hidden="true">
                <i [class]="getVariantIcon(toast.variant)"></i>
            </span>

            <p class="text-[14px] font-sans font-medium wrap-break-word leading-relaxed">
                {{ toast.message }}
            </p>
        </div>

        <button type="button" (click)="toastService.dismiss(toast.id)" aria-label="إغلاق التنبيه"
            class="opacity-60 hover:opacity-100 p-1 mr-2 transition-opacity duration-150 outline-none shrink-0 cursor-pointer">
            <i class="fa-solid fa-xmark text-sm"></i>
        </button>
    </div>
    }
</div>
