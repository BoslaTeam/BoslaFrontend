<label class="inline-flex items-start sm:items-center space-x-3 cursor-pointer select-none group"
  [class.opacity-50]="disabled()" [class.cursor-not-allowed]="disabled()">
  <div class="relative flex items-center h-5">
    <input type="checkbox" [checked]="value()" [disabled]="disabled()" (change)="onChange_($event)"
      (blur)="onTouched_()" class="peer sr-only" />

    <div class="w-5 h-5 bg-bosla-offwhite border border-bosla-charcoal/10 rounded-xl transition-all duration-200 flex items-center justify-center 
             peer-focus:ring-2 peer-focus:ring-offset-0 peer-focus:ring-bosla-blue/10 peer-focus:border-bosla-blue
             peer-checked:bg-bosla-blue peer-checked:border-bosla-blue">
      <svg class="w-3.5 h-3.5 text-white scale-0 transition-transform duration-200" [class.scale-100]="value()"
        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </div>
  </div>

  @if (label()) {
  <span class="text-sm font-medium text-bosla-charcoal/80 group-hover:text-bosla-charcoal transition-colors">
    {{ label() }}
  </span>
  }
</label>
