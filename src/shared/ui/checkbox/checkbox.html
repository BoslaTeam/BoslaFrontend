<label 
  class="inline-flex items-start sm:items-center space-x-3 cursor-pointer select-none group"
  [class.opacity-50]="disabled()"
  [class.cursor-not-allowed]="disabled()"
>
  <div class="relative flex items-center h-5">
    <input
      type="checkbox"
      [checked]="value()"
      [disabled]="disabled()"
      (change)="onChange_($event)"
      (blur)="onTouched_()"
      class="peer sr-only"
    />
    
    <div 
      class="w-5 h-5 bg-white border border-slate-300 rounded-md transition-all duration-200 flex items-center justify-center 
             peer-focus:ring-2 peer-focus:ring-offset-0 peer-focus:ring-blue-500/20 peer-focus:border-blue-500
             peer-checked:bg-blue-600 peer-checked:border-blue-600"
    >
      <svg 
        class="w-3.5 h-3.5 text-white scale-0 transition-transform duration-200"
        [class.scale-100]="value()"
        xmlns="http://www.w3.org/2000/svg" 
        fill="none" 
        viewBox="0 0 24 24" 
        stroke="currentColor" 
        stroke-width="3"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </div>
  </div>

  @if (label()) {
    <span class="text-sm font-medium text-slate-700 group-hover:text-slate-900 transition-colors">
      {{ label() }}
    </span>
  }
</label>
