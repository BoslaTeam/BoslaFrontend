<div
    [class]="'relative inline-flex items-center justify-center rounded-full bg-bosla-offwhite border border-bosla-charcoal/10 overflow-hidden select-none shrink-0 ' + getSizeClasses()">
    @if (src()) {
    <img [src]="src()" [alt]="name()" class="h-full w-full object-cover" />
    } @else {
    <span [class]="'font-medium text-bosla-charcoal/60 tracking-wider ' + getTextSizeClasses()">
        {{ initials() }}
    </span>
    }
</div>
