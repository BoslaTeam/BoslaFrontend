<div class="w-full bg-white border border-bosla-charcoal/10 rounded-2xl divide-y divide-bosla-charcoal/10 overflow-hidden shadow-sm" dir="rtl">
  
  @for (row of [].constructor(rowsCount()); track $index) {
    <div class="w-full h-13 px-4 flex items-center justify-between gap-6 animate-pulse bg-white">
      
      <div class="flex items-center gap-4 flex-1">
        <div class="w-8 h-8 bg-bosla-charcoal/10 rounded-xl shrink-0"></div>
        
        <div class="h-4 bg-bosla-charcoal/10 rounded-xl w-28"></div>
      </div>

      <div class="flex-1 flex justify-center">
        <div class="h-4 bg-bosla-charcoal/10 rounded-xl w-24"></div>
      </div>

      <div class="flex-1 flex justify-end">
        <div class="h-4 bg-bosla-charcoal/10 rounded-xl w-36"></div>
      </div>

    </div>
  }

</div>
