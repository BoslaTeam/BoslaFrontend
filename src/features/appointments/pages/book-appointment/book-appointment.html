<div
  class="mx-auto relative flex flex-col items-center justify-center min-h-screen overflow-hidden pt-28 px-2 pb-12"
  dir="rtl"
>
  <video
    autoplay
    loop
    [muted]="true"
    playsinline
    oncontextmenu="return false;"
    class="absolute inset-0 w-full h-full object-cover z-0 pointer-events-none"
  >
    <source src="assets/videos/login.mp4" type="video/mp4" />
  </video>
  <div
    class="absolute inset-0 z-0 bg-[linear-gradient(135deg,rgba(27,79,114,0.85)_0%,rgba(46,134,171,0.6)_100%)]"
  ></div>
  <div class="mb-6">
    <a
      [routerLink]="['/user/appointments']"
      class="inline-flex items-center gap-2 text-sm text-black font-sans"
    >
      <svg
        class="w-4 h-4 transform rotate-180"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
      العودة إلى المواعيد
    </a>
  </div>
  <div
    class="bg-white/60 dark:bg-bosla-charcoal/10 backdrop-blur-md border border-bosla-charcoal/5 dark:border-white/5 rounded-2xl p-6 sm:p-8 shadow-sm"
  >
    <div class="border-b border-bosla-charcoal/5 dark:border-white/5 pb-5 mb-6">
      <h1 class="text-xl font-bold text-bosla-charcoal dark:text-white font-sans">
        طلب حجز موعد جديد
      </h1>
      <p class="text-xs text-bosla-charcoal/50 dark:text-white/40 mt-1 font-sans">
        أدخل تفاصيل موعد الجلسة الاستشارية ليتم جدولتها مع المختص فوراً.
      </p>
    </div>
    @if (specialistId()) {
      <div
        class="flex items-center gap-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-900/60 rounded-xl p-4 mb-6"
      >
        <span class="flex h-2 w-2 relative">
          <span
            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"
          ></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
        </span>
        <p class="text-sm text-emerald-800 dark:text-emerald-400 font-sans font-medium">
          تم ربط الحجز تلقائياً بالمختص المحدد بنجاح.
        </p>
      </div>
    }
    <form (ngSubmit)="onSubmit()" #bookingForm="ngForm" class="space-y-5">
      <!-- <div>
        <label
          class="block text-xs font-semibold text-bosla-charcoal/70 dark:text-white/70 mb-2 font-sans"
          >معرّف المختص / الخبير *</label
        >
        <input
          type="text"
          required
          [value]="specialistId()"
          (input)="specialistId.set($any($event.target).value)"
          placeholder="أدخل معرّف المختص (GUID)"
          class="w-full p-3 text-sm bg-bosla-offwhite dark:bg-white/5 border border-bosla-charcoal/10 dark:border-white/10 rounded-xl outline-none focus:border-bosla-blue dark:focus:border-bosla-blue text-bosla-charcoal dark:text-white font-mono"
        />
      </div> -->

      <div>
        <label
          class="block text-xs font-semibold text-bosla-charcoal/70 dark:text-white/70 mb-2 font-sans"
          >موضوع أو عنوان الجلسة (اختياري)</label
        >
        <input
          type="text"
          [value]="sessionTopic()"
          (input)="sessionTopic.set($any($event.target).value)"
          placeholder="مثال: استشارة تقنية، تطوير أعمال"
          class="w-full p-3 text-sm bg-bosla-offwhite dark:bg-white/5 border border-bosla-charcoal/10 dark:border-white/10 rounded-xl outline-none focus:border-bosla-blue dark:focus:border-bosla-blue text-bosla-charcoal dark:text-white font-sans"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="sm:col-span-1">
          <label
            class="block text-xs font-semibold text-bosla-charcoal/70 dark:text-white/70 mb-2 font-sans"
            >تاريخ الموعد *</label
          >
          <input
            type="date"
            required
            [value]="appointmentDate()"
            (input)="appointmentDate.set($any($event.target).value)"
            class="w-full p-3 text-sm bg-bosla-offwhite dark:bg-white/5 border border-bosla-charcoal/10 dark:border-white/10 rounded-xl outline-none focus:border-bosla-blue dark:focus:border-bosla-blue text-bosla-charcoal dark:text-white font-sans"
          />
        </div>

        <div>
          <label
            class="block text-xs font-semibold text-bosla-charcoal/70 dark:text-white/70 mb-2 font-sans"
            >وقت البدء *</label
          >
          <input
            type="time"
            required
            [value]="startTime()"
            (input)="startTime.set($any($event.target).value)"
            class="w-full p-3 text-sm bg-bosla-offwhite dark:bg-white/5 border border-bosla-charcoal/10 dark:border-white/10 rounded-xl outline-none focus:border-bosla-blue dark:focus:border-bosla-blue text-bosla-charcoal dark:text-white font-sans"
          />
        </div>

        <div>
          <label
            class="block text-xs font-semibold text-bosla-charcoal/70 dark:text-white/70 mb-2 font-sans"
            >وقت الانتهاء *</label
          >
          <input
            type="time"
            required
            [value]="endTime()"
            (input)="endTime.set($any($event.target).value)"
            class="w-full p-3 text-sm bg-bosla-offwhite dark:bg-white/5 border border-bosla-charcoal/10 dark:border-white/10 rounded-xl outline-none focus:border-bosla-blue dark:focus:border-bosla-blue text-bosla-charcoal dark:text-white font-sans"
          />
        </div>
      </div>

      <div>
        <label
          class="block text-xs font-semibold text-bosla-charcoal/70 dark:text-white/70 mb-2 font-sans"
          >ملاحظات إضافية للمختص (اختياري)</label
        >
        <textarea
          [value]="notes()"
          (input)="notes.set($any($event.target).value)"
          placeholder="اكتب تفاصيل إضافية أو محاور ترغب بنقاشها أثناء الجلسة..."
          class="w-full h-28 p-3 text-sm bg-bosla-offwhite dark:bg-white/5 border border-bosla-charcoal/10 dark:border-white/10 rounded-xl outline-none focus:border-bosla-blue dark:focus:border-bosla-blue text-bosla-charcoal dark:text-white font-sans resize-none"
        ></textarea>
      </div>

      <div
        class="flex justify-end gap-3 border-t border-bosla-charcoal/5 dark:border-white/5 pt-5 mt-6"
      >
        <ui-button [routerLink]="['/appointments']" size="md" variant="ghost">إلغاء</ui-button>
        <ui-button
          type="submit"
          size="md"
          variant="primary"
          [disabled]="!bookingForm.valid"
          [loading]="store.isActionLoading()"
        >
          تأكيد وإرسال الطلب
        </ui-button>
      </div>
    </form>
  </div>
</div>
