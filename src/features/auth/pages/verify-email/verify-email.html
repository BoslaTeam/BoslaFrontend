<div class="flex min-h-full flex-col justify-center pt-28 pb-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white/80 backdrop-blur-xl py-12 px-4 shadow-2xl shadow-terracotta/5 sm:rounded-3xl sm:px-10 border border-white/50 text-center">
      @if (isVerifying) {
        <svg class="animate-spin mx-auto h-12 w-12 text-terracotta mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      } @else if (isSuccess) {
        <div class="w-16 h-16 mx-auto bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-4">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
      } @else {
        <div class="w-16 h-16 mx-auto bg-red-100 text-red-600 rounded-full flex items-center justify-center mb-4">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </div>
      }

      <h2 class="text-2xl font-black text-charcoal mb-2">{{ isVerifying ? 'جاري التحقق...' : (isSuccess ? 'تم بنجاح!' : 'عذراً!') }}</h2>
      <p class="text-sm text-charcoal/70 mb-8">{{ message }}</p>

      @if (!isVerifying) {
        <a routerLink="/auth/login" class="inline-block w-full rounded-xl bg-terracotta px-3 py-3 text-sm font-semibold text-white shadow-md hover:bg-terracotta-dark transition-all">
          المتابعة لتسجيل الدخول
        </a>
      }
    </div>
  </div>
</div>
