<div class="relative flex items-center justify-center min-h-screen pt-28 px-4 pb-12 overflow-hidden">
  <video autoplay loop [muted]="true" playsinline oncontextmenu="return false;" class="absolute inset-0 w-full h-full object-cover z-0 pointer-events-none">
    <source src="assets/videos/login.mp4" type="video/mp4">
  </video>
  <div class="absolute inset-0 z-10 bg-[linear-gradient(135deg,rgba(27,79,114,0.85)_0%,rgba(46,134,171,0.6)_100%)]"></div>
  
  <div class="relative z-10 w-full flex justify-center px-4">
    <div class="w-full max-w-md bg-white/95 backdrop-blur-[16px] rounded-2xl shadow-[0_20px_60px_rgba(0,0,0,0.15)] p-10 border border-white/30">
      <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center bg-gradient-to-br from-bosla-primary to-bosla-blue shadow-[0_8px_25px_rgba(27,79,114,0.3)]">
          <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <h2 class="text-2xl font-black text-bosla-primary mt-4 mb-2">{{ 'auth.verifyEmail.confirmAccount' | t }}</h2>
      </div>

      <div class="text-center mb-8">
        @if (isVerifying) {
          <div class="flex flex-col items-center justify-center py-4">
            <svg class="animate-spin h-10 w-10 text-bosla-blue mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-bosla-primary font-bold">{{ message }}</p>
          </div>
        } @else {
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-full mb-4" 
               [style.background]="isSuccess ? 'rgba(22,163,74,0.1)' : 'rgba(186,26,26,0.1)'">
            <svg class="w-8 h-8" [style.color]="isSuccess ? '#16a34a' : '#ba1a1a'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              @if (isSuccess) {
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
              } @else {
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
              }
            </svg>
          </div>
          <h3 class="text-lg font-bold mb-2" [class.text-bosla-success]="isSuccess" [class.text-bosla-error]="!isSuccess">
            {{ isSuccess ? ('auth.verifyEmail.success' | t) : ('auth.verifyEmail.failed' | t) }}
          </h3>
          <p class="text-sm text-bosla-charcoal/70 leading-relaxed">{{ message }}</p>
        }
      </div>

      @if (!isVerifying) {
        <div class="mt-6">
          <a routerLink="/auth/login" class="w-full flex items-center justify-center gap-2 rounded-xl py-3.5 text-sm font-bold text-white border-none cursor-pointer transition-all bg-gradient-to-br from-bosla-primary to-bosla-blue shadow-[0_4px_15px_rgba(27,79,114,0.3)] hover:-translate-y-0.5 hover:shadow-[0_6px_20px_rgba(27,79,114,0.4)] active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
            {{ 'auth.verifyEmail.continueToLogin' | t }}
          </a>
        </div>
      }
    </div>
  </div>
</div>
