<header
  class="flex items-center gap-4 px-6 py-4 bg-white/70 backdrop-blur-xl border-b border-white/50 shrink-0 select-none shadow-[0_5px_30px_rgba(27,79,114,0.03)] font-sans relative z-20 transition-all duration-300">
  
  <!-- Back button (mobile) -->
  <button
    class="flex lg:hidden items-center justify-center w-10 h-10 rounded-2xl bg-white/50 text-[#1B4F72] hover:bg-white/80 hover:shadow-sm transition-all shrink-0 cursor-pointer"
    (click)="goBack()" [attr.aria-label]="'messaging.backToConversations' | t" id="chat-back-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="m15 18-6-6 6-6" />
    </svg>
  </button>

  <!-- Avatar -->
  <div class="relative shrink-0">
    <div
      class="w-12 h-12 rounded-[1rem] flex items-center justify-center text-sm font-bold text-white bg-gradient-to-tr from-[#1B4F72] to-[#2E86AB] overflow-hidden shadow-md">
      @if (participant()?.avatarUrl) {
      <img class="w-full h-full object-cover" [src]="participant()!.avatarUrl" [alt]="participant()!.name" />
      } @else {
      {{ initials() }}
      }
    </div>
    @if (isOnline()) {
    <span class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-[#10B981] border-[3px] border-white shadow-[0_0_8px_rgba(16,185,129,0.5)] animate-pulse"
      [attr.aria-label]="'status.online' | t"></span>
    }
  </div>

  <!-- Info -->
  <div class="flex-1 min-w-0 flex flex-col gap-1">
    <div class="flex items-center gap-1.5">
      <span class="text-base font-black text-[#1B4F72] truncate tracking-tight">{{ participant()?.name }}</span>
    </div>
    <div class="flex items-center gap-2">
      @if (participant()?.specialization) {
      <span class="text-[11px] font-bold text-slate-500 truncate">{{ participant()!.specialization }}</span>
      <span class="w-1 h-1 rounded-full bg-slate-300"></span>
      }
      <div class="text-[10px] font-bold flex items-center gap-1.5">
        @if (isOnline()) {
        <span class="text-[#10B981]">{{ 'status.online' | t }} {{ 'time.now' | t }}</span>
        } @else {
        <span class="text-slate-400">{{ 'status.offline' | t }}</span>
        }
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="flex items-center gap-2 text-slate-400">
    <!-- Toggle conversation list -->
    <button
      class="hidden md:flex w-10 h-10 rounded-2xl items-center justify-center hover:bg-white hover:text-[#1B4F72] hover:shadow-sm transition-all cursor-pointer"
      [class.text-[#1B4F72]]="isOpen()" [class.text-slate-400]="!isOpen()" [class.bg-white]="isOpen()" [class.shadow-sm]="isOpen()"
      (click)="onTogglePanel()" [attr.aria-expanded]="isOpen()" [attr.aria-label]="'messaging.toggleConversationList' | t"
      [title]="'messaging.toggleConversationList' | t">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
      </svg>
    </button>

    <!-- Toggle details sidebar -->
    <button
      class="w-10 h-10 rounded-2xl flex items-center justify-center hover:bg-white hover:text-[#1B4F72] hover:shadow-sm transition-all cursor-pointer"
      [class.text-[#1B4F72]]="isDetailsOpen()" [class.text-slate-400]="!isDetailsOpen()"
      [class.bg-white]="isDetailsOpen()" [class.shadow-sm]="isDetailsOpen()" (click)="onToggleDetailsPanel()"
      [attr.aria-expanded]="isDetailsOpen()" [attr.aria-label]="'messaging.toggleDetails' | t" [title]="'messaging.toggleDetails' | t">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="16" x2="12" y2="12" />
        <line x1="12" y1="8" x2="12.01" y2="8" />
      </svg>
    </button>

    <!-- More Menu -->
    <button
      class="w-10 h-10 rounded-2xl flex items-center justify-center hover:bg-white hover:text-[#1B4F72] hover:shadow-sm transition-all cursor-pointer"
      [attr.aria-label]="'common.more.almzyd' | t" [title]="'common.more.almzyd' | t">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="5" r="1.5" />
        <circle cx="12" cy="12" r="1.5" />
        <circle cx="12" cy="19" r="1.5" />
      </svg>
    </button>
  </div>
</header>
