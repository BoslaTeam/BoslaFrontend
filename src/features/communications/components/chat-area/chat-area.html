<section
  [class]="(store.activeMobilePanel() === 'chat')
    ? 'absolute inset-0 w-full z-10 md:relative md:w-auto flex flex-col h-full bg-bosla-offwhite min-w-0 overflow-hidden transition-transform duration-300 translate-x-0'
    : 'absolute inset-0 w-full z-10 md:relative md:w-auto flex flex-col h-full bg-bosla-offwhite min-w-0 overflow-hidden transition-transform duration-300 translate-x-full md:translate-x-0'"
  aria-label="Chat area"
>
  @if (store.activeConversation()) {
    <chat-chat-header />

    <chat-message-list />

    <chat-message-composer />
  } @else {
    <!-- Empty — no conversation selected -->
    <div class="flex-1 flex flex-col items-center justify-center p-8 text-center gap-4 bg-white md:bg-bosla-offwhite">
      <div class="w-20 h-20 rounded-3xl bg-bosla-primary/5 flex items-center justify-center text-bosla-blue shadow-sm border border-bosla-primary/5">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <h3 class="text-lg font-bold text-bosla-charcoal font-sans">حدد محادثة</h3>
      <p class="text-xs text-bosla-grey/90 leading-relaxed max-w-70">اختر محادثة من القائمة لبدء المراسلة، أو ابحث عن متخصص لحجز جلسة.</p>
    </div>
  }
</section>
