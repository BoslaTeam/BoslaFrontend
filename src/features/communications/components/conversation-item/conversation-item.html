<button
  [class]="isActive()
    ? 'w-full text-left relative flex items-center gap-4 p-4 rounded-2xl bg-white/80 shadow-[0_5px_20px_rgba(27,79,114,0.08)] transition-all cursor-pointer font-sans group border border-slate-100/50 mb-2'
    : 'w-full text-left relative flex items-center gap-4 p-4 rounded-2xl bg-transparent hover:bg-white/40 hover:shadow-[0_5px_15px_rgba(27,79,114,0.05)] transition-all cursor-pointer font-sans group border border-transparent hover:border-slate-100/30 mb-2'"
  (click)="onClick()" [attr.aria-current]="isActive() ? 'true' : null"
  [attr.aria-label]="'Conversation with ' + conversation().participant.name">
  
  <!-- Active Right Indicator Bar (RTL friendly) -->
  <div class="absolute right-0 top-1/2 -translate-y-1/2 w-1.5 h-0 bg-gradient-to-b from-[#F39C12] to-[#e67e22] rounded-l-full transition-all duration-300 ease-out shadow-[0_0_10px_rgba(243,156,18,0.5)]"
    [class.h-8]="isActive()" [class.opacity-100]="isActive()" [class.opacity-0]="!isActive()"></div>

  <!-- Avatar with Online Indicator -->
  <div class="relative shrink-0 group-hover:scale-105 transition-transform duration-300">
    <div
      class="w-12 h-12 rounded-[1rem] flex items-center justify-center text-sm font-bold text-white bg-gradient-to-tr from-[#1B4F72] to-[#2E86AB] overflow-hidden shadow-md">
      @if (conversation().participant.avatarUrl) {
      <img class="w-full h-full object-cover" [src]="conversation().participant.avatarUrl"
        [alt]="conversation().participant.name" />
      } @else {
      {{ initials() }}
      }
    </div>
    @if (isOnline()) {
    <span class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-[#10B981] border-[3px] border-white shadow-[0_0_5px_rgba(16,185,129,0.5)]"
      aria-label="Online"></span>
    }
  </div>

  <!-- Info -->
  <div class="flex-1 min-w-0 flex flex-col gap-1">
    <!-- Name row -->
    <div class="flex items-center justify-between gap-2">
      <div class="flex items-center gap-1.5 min-w-0">
        <span class="text-sm font-black text-[#1B4F72] truncate font-sans tracking-tight">{{ conversation().participant.name
          }}</span>
        <span
          class="inline-flex items-center px-2 py-0.5 rounded-md text-[9px] font-bold border shrink-0 tracking-wide font-sans shadow-sm"
          [class]="roleBadgeClass()">{{ roleLabel() }}</span>
      </div>
      <span class="text-[10px] text-slate-400 shrink-0 font-bold font-sans">{{ formattedTime() }}</span>
    </div>

    <!-- Preview row -->
    <div class="flex items-center justify-between gap-2">
      <span [class]="conversation().unreadCount > 0
          ? 'text-xs text-[#2E86AB] font-bold truncate flex-1 font-sans'
          : 'text-xs text-slate-500 truncate flex-1 font-sans'">{{ conversation().lastMessage }}</span>

      @if (conversation().unreadCount > 0) {
      <span
        class="min-w-[1.25rem] h-5 rounded-full bg-gradient-to-r from-[#F39C12] to-[#e67e22] text-white text-[10px] font-black flex items-center justify-center px-1.5 shrink-0 shadow-[0_0_10px_rgba(243,156,18,0.5)] animate-pulse"
        [attr.aria-label]="conversation().unreadCount + ' unread messages'">
        {{ conversation().unreadCount > 99 ? '99+' : conversation().unreadCount }}
      </span>
      }
    </div>
  </div>
</button>
