<button
  [class]="isActive()
    ? 'w-full text-left relative flex items-center gap-3 p-3.5 border-b border-bosla-primary/5 bg-bosla-primary/[0.04] transition-all cursor-pointer font-inter group'
    : 'w-full text-left relative flex items-center gap-3 p-3.5 border-b border-bosla-primary/5 hover:bg-bosla-primary/[0.02] transition-all cursor-pointer font-inter group'"
  (click)="onClick()"
  [attr.aria-current]="isActive() ? 'true' : null"
  [attr.aria-label]="'Conversation with ' + conversation().participant.name"
>
  <!-- Active Left Indicator Bar -->
  <div class="absolute left-0 top-0 bottom-0 w-1 bg-bosla-primary transition-all duration-200" [class.scale-y-100]="isActive()" [class.scale-y-0]="!isActive()"></div>

  <!-- Avatar with Online Indicator -->
  <div class="relative shrink-0">
    <div class="w-11 h-11 rounded-full flex items-center justify-center text-sm font-bold text-white bg-gradient-to-tr from-bosla-primary to-bosla-blue overflow-hidden shadow-sm">
      @if (conversation().participant.avatarUrl) {
        <img class="w-full h-full object-cover" [src]="conversation().participant.avatarUrl" [alt]="conversation().participant.name" />
      } @else {
        {{ initials() }}
      }
    </div>
    @if (conversation().participant.isOnline) {
      <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-bosla-success border-2 border-white" aria-label="Online"></span>
    }
  </div>

  <!-- Info -->
  <div class="flex-1 min-w-0 flex flex-col gap-0.5">
    <!-- Name row -->
    <div class="flex items-center justify-between gap-2">
      <div class="flex items-center gap-1.5 min-w-0">
        <span class="text-xs font-bold text-bosla-charcoal truncate font-inter">{{ conversation().participant.name }}</span>
        <span class="inline-flex items-center px-1.5 py-0.5 rounded-full text-[9px] font-bold border shrink-0 tracking-wide font-inter" [class]="roleBadgeClass()">{{ roleLabel() }}</span>
      </div>
      <span class="text-[10px] text-bosla-grey/80 shrink-0 font-medium font-inter">{{ formattedTime() }}</span>
    </div>

    <!-- Preview row -->
    <div class="flex items-center justify-between gap-2">
      <span
        [class]="conversation().unreadCount > 0
          ? 'text-xs text-bosla-charcoal font-semibold truncate flex-1 font-inter'
          : 'text-xs text-bosla-grey/90 truncate flex-1 font-inter'"
      >{{ conversation().lastMessage }}</span>

      @if (conversation().unreadCount > 0) {
        <span class="min-w-[1.25rem] h-5 rounded-full bg-bosla-orange text-white text-[10px] font-bold flex items-center justify-center px-1.5 shrink-0" [attr.aria-label]="conversation().unreadCount + ' unread messages'">
          {{ conversation().unreadCount > 99 ? '99+' : conversation().unreadCount }}
        </span>
      }
    </div>
  </div>
</button>
