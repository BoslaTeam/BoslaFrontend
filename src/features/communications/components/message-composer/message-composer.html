<div class="px-3 py-2 md:p-4 bg-transparent shrink-0 font-sans relative" role="region" aria-label="Message input">
  <!-- Pill container: always single row -->
  <div class="rounded-full bg-white/80 backdrop-blur-xl shadow-[0_6px_24px_rgba(27,79,114,0.08)] border border-white/80 flex flex-row items-center gap-1 px-2 py-1.5 focus-within:shadow-[0_6px_24px_rgba(243,156,18,0.18)] focus-within:border-[#F39C12]/50 transition-all duration-300">

    <!-- Send button — on the START (right in RTL) -->
    <button
      class="w-9 h-9 md:w-11 md:h-11 rounded-full bg-gradient-to-tr from-[#F39C12] to-[#e67e22] text-white flex items-center justify-center transition-all cursor-pointer hover:shadow-[0_0_12px_rgba(243,156,18,0.5)] hover:scale-105 focus:outline-none focus:ring-2 focus:ring-[#F39C12]/50 disabled:from-slate-300 disabled:to-slate-400 disabled:text-white/60 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:hover:shadow-none shadow-sm md:shadow-md shrink-0 group"
      id="chat-send-button"
      type="button"
      (click)="send()"
      [disabled]="!message().trim() || store.isSendingMessage()"
      aria-label="إرسال الرسالة"
      title="إرسال الرسالة (Enter)"
    >
      @if (store.isSendingMessage()) {
        <svg class="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
      } @else {
        <svg class="transform group-hover:translate-x-0.5 transition-transform" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      }
    </button>

    <!-- Textarea — fills remaining space -->
    <textarea
      #textarea
      id="chat-message-input"
      class="flex-1 resize-none bg-transparent py-2 px-2 text-sm text-[#1B4F72] font-semibold placeholder-slate-400 focus:outline-none min-h-[36px] max-h-[120px] overflow-y-auto leading-relaxed font-sans"
      placeholder="اكتب رسالة..."
      rows="1"
      [value]="message()"
      (input)="onInput($event)"
      (keydown)="onKeyDown($event)"
      aria-label="Message text"
      [attr.aria-disabled]="store.isSendingMessage() ? 'true' : null"
    ></textarea>

    <!-- Icon buttons on the END (left in RTL) -->
    <div class="flex items-center gap-0.5 shrink-0">

      <!-- AI Smart Reply panel (only visible for Specialists) -->
      @if (isSpecialist() && store.activeConversationId()) {
        <div class="relative">
          <ai-smart-reply
            [conversationId]="store.activeConversationId()!"
            (replySelected)="fillFromReply($event)"
          />
        </div>
      }

      <!-- ── Emoji Picker ── -->
      <div class="relative">
        <bosla-emoji-picker
          (emojiSelected)="insertEmoji($event)"
        />
      </div>

      <!-- Attachment button (future) — hidden on very small screens -->
      <button
        class="hidden sm:flex w-8 h-8 rounded-full items-center justify-center text-[#1B4F72]/40 cursor-default focus:outline-none"
        aria-label="إرفاق ملف"
        title="إرفاق ملف"
        type="button"
        [disabled]="true"
      >
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Keyboard hint: hidden on mobile -->
  <div class="hidden md:flex justify-center mt-3 opacity-60">
    <p class="text-[10px] text-[#1B4F72] font-sans flex items-center gap-1.5 select-none font-bold">
      اضغط <kbd class="px-2 py-0.5 rounded-md bg-white/50 border border-white text-[9px] font-black text-[#1B4F72] font-mono shadow-sm">Enter</kbd> للإرسال · <kbd class="px-2 py-0.5 rounded-md bg-white/50 border border-white text-[9px] font-black text-[#1B4F72] font-mono shadow-sm">Shift+Enter</kbd> لسطر جديد
    </p>
  </div>
</div>
