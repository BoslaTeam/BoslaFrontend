@if (participant()) {
  <!-- Specialist Card -->
  <div class="p-4 pb-3 border-b border-bosla-primary/10">
    <button
      class="w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-bosla-primary/[0.04] transition-all duration-200 text-left cursor-pointer group"
      (click)="openProfile()"
      aria-label="عرض الملف الشخصي"
    >
      <!-- Avatar -->
      <div class="relative shrink-0">
        <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-bosla-primary to-bosla-blue text-white flex items-center justify-center text-sm font-bold overflow-hidden shadow-sm">
          @if (participant()!.avatarUrl) {
            <img class="w-full h-full object-cover" [src]="participant()!.avatarUrl" [alt]="participant()!.name" />
          } @else {
            {{ initials() }}
          }
        </div>
        @if (participant()!.isOnline) {
          <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-bosla-success border-2 border-white"></span>
        } @else {
          <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-bosla-grey border-2 border-white"></span>
        }
      </div>

      <!-- Info -->
      <div class="flex-1 min-w-0">
        <div class="text-sm font-bold text-bosla-charcoal truncate group-hover:text-bosla-primary transition-colors">
          {{ participant()!.name }}
        </div>
        @if (participant()!.specialization) {
          <div class="text-xs text-bosla-grey truncate mt-0.5">
            {{ participant()!.specialization }}
          </div>
        }
        <div class="flex items-center gap-1 mt-0.5">
          <span class="w-1.5 h-1.5 rounded-full" [class]="participant()!.isOnline ? 'bg-bosla-success' : 'bg-bosla-grey'"></span>
          <span class="text-[10px] font-medium" [class]="participant()!.isOnline ? 'text-bosla-success' : 'text-bosla-grey'">
            {{ participant()!.isOnline ? 'متصل' : 'غير متصل' }}
          </span>
        </div>
      </div>

      <!-- Chevron -->
      <svg class="text-bosla-grey/40 shrink-0 group-hover:text-bosla-primary/60 transition-colors" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  </div>

  <!-- Upcoming Session (card handles its own visibility and title) -->
  @if (appointmentId()) {
    <chat-upcoming-session-card [appointmentId]="appointmentId()!" />
  }

  <!-- Shared Resources -->
  <div class="p-4">
    <h4 class="text-[10px] font-bold text-bosla-grey uppercase tracking-widest mb-2.5">الموارد المشتركة</h4>
    <div class="flex flex-col gap-0.5">
      <button class="flex items-center gap-2.5 w-full p-2 rounded-lg hover:bg-bosla-primary/[0.04] transition-all duration-200 text-left cursor-pointer group">
        <span class="w-7 h-7 rounded-lg bg-bosla-primary/5 flex items-center justify-center text-sm shrink-0 group-hover:bg-bosla-primary/10 transition-colors">📄</span>
        <span class="text-xs font-medium text-bosla-charcoal group-hover:text-bosla-primary transition-colors">الملفات المشتركة</span>
      </button>
      <button class="flex items-center gap-2.5 w-full p-2 rounded-lg hover:bg-bosla-primary/[0.04] transition-all duration-200 text-left cursor-pointer group">
        <span class="w-7 h-7 rounded-lg bg-bosla-primary/5 flex items-center justify-center text-sm shrink-0 group-hover:bg-bosla-primary/10 transition-colors">📝</span>
        <span class="text-xs font-medium text-bosla-charcoal group-hover:text-bosla-primary transition-colors">الملاحظات</span>
      </button>
      @if (appointmentId()) {
        <button class="flex items-center gap-2.5 w-full p-2 rounded-lg hover:bg-bosla-primary/[0.04] transition-all duration-200 text-left cursor-pointer group">
          <span class="w-7 h-7 rounded-lg bg-bosla-primary/5 flex items-center justify-center text-sm shrink-0 group-hover:bg-bosla-primary/10 transition-colors">🎥</span>
          <span class="text-xs font-medium text-bosla-charcoal group-hover:text-bosla-primary transition-colors">جلسة فيديو</span>
        </button>
      }
    </div>
  </div>
} @else {
  <!-- Empty state when no conversation selected -->
  <div class="flex flex-col items-center justify-center p-6 text-center h-full gap-3">
    <div class="w-12 h-12 rounded-2xl bg-bosla-primary/5 flex items-center justify-center text-bosla-blue">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
    <div class="flex flex-col gap-1">
      <h4 class="text-xs font-bold text-bosla-charcoal">لم يتم اختيار محادثة</h4>
      <p class="text-[11px] text-bosla-grey leading-relaxed max-w-[180px]">اختر محادثة من القائمة لعرض تفاصيلها.</p>
    </div>
  </div>
}
