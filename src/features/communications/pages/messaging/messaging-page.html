<!-- Connection banner for reconnecting state -->
@if (signalrService.connectionState() === 'reconnecting') {
  <div class="flex items-center justify-center gap-2 py-2.5 px-4 bg-bosla-orange/5 border-b border-bosla-orange/20 text-xs text-bosla-orange font-medium shrink-0" role="alert" aria-live="assertive">
    <svg class="animate-spin text-bosla-orange" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
    </svg>
    جاري إعادة الاتصال بالخادم...
  </div>
}

@if (signalrService.connectionState() === 'disconnected') {
  <div class="flex items-center justify-center gap-2 py-2.5 px-4 bg-bosla-error/5 border-b border-bosla-error/20 text-xs text-bosla-error font-medium shrink-0" role="alert" aria-live="assertive">
    <svg class="text-bosla-error shrink-0" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    لا يوجد اتصال — قد لا يتم إرسال الرسائل
  </div>
}

<!-- Main Layout Grid -->
<div
  [class]="store.isContextPanelOpen()
    ? 'grid grid-cols-1 md:grid-cols-[320px_1fr_340px] lg:grid-cols-[320px_1fr_380px] relative w-full flex-1 min-h-0 overflow-hidden bg-bosla-offwhite font-sans'
    : 'grid grid-cols-1 md:grid-cols-[320px_1fr] relative w-full flex-1 min-h-0 overflow-hidden bg-bosla-offwhite font-sans'"
>

  <!-- Column 1: Conversation List -->
  <chat-conversation-sidebar />

  <!-- Column 2: Chat Area -->
  <chat-chat-area />

  <!-- Column 3: Context Panel -->
  @if (store.isContextPanelOpen()) {
    <chat-context-panel />
  }

</div>
