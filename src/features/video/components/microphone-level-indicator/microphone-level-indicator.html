<div class="level-indicator" role="meter" [attr.aria-label]="'video.audioLevel' | t" aria-valuenow="{{ barPercent() }}">
  @if (error()) {
    <span class="level-indicator-error">{{ error() }}</span>
  } @else {
    <div class="level-indicator-bar-track">
      <div
        class="level-indicator-bar-fill"
        [class]="barClass()"
        [style.width.%]="barPercent()"
      ></div>
    </div>
    <span class="level-indicator-percent">{{ barPercent() }}%</span>
  }
</div>
