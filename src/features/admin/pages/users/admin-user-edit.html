<div class="user-form-page">
  <button class="back-btn" (click)="goBack()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/>
      <polyline points="12 19 5 12 12 5"/>
    </svg>
    {{ 'common.backToList' | t }}
  </button>

  <div class="form-card">
    <div class="form-header">
      <h2>{{ 'admin.users.editUserTitle' | t }}</h2>
      <p>{{ 'admin.users.editDesc' | t }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="user-form">
      <div class="form-grid">
        <div class="form-group">
          <label>{{ 'admin.users.fullNameLabel' | t }}</label>
          <input type="text" formControlName="fullName" [placeholder]="'admin.users.fullNamePlaceholder' | t" class="form-input">
        </div>

        <div class="form-group">
          <label>{{ 'auth.register.phone' | t }}</label>
          <input type="text" formControlName="phoneNumber" [placeholder]="'auth.register.phone' | t" class="form-input">
        </div>

        <div class="form-group">
          <label>{{ 'admin.users.country' | t }}</label>
          <input type="text" formControlName="country" [placeholder]="'admin.users.countryPlaceholder' | t" class="form-input">
        </div>

        <div class="form-group">
          <label>{{ 'admin.users.jobTitleLabel' | t }}</label>
          <input type="text" formControlName="title" [placeholder]="'admin.users.jobTitlePlaceholder' | t" class="form-input">
        </div>

        <div class="form-group">
          <label>{{ 'admin.users.gender' | t }}</label>
          <select formControlName="gender" class="form-input">
            <option value="">{{ 'common.notSpecifiedGender' | t }}</option>
            <option value="Male">{{ 'common.male' | t }}</option>
            <option value="Female">{{ 'common.female' | t }}</option>
          </select>
        </div>

        <div class="form-group">
          <label>{{ 'admin.users.preferredLanguage' | t }}</label>
          <input type="text" formControlName="preferredLanguage" [placeholder]="'admin.users.preferredLanguagePlaceholder' | t" class="form-input">
        </div>

        <div class="form-group" style="grid-column: 1 / -1;">
          <label>{{ 'admin.users.bioLabel' | t }}</label>
          <textarea formControlName="bio" [placeholder]="'admin.users.bioPlaceholder' | t" class="form-input" rows="3"></textarea>
        </div>

        <div class="form-group">
          <label>{{ 'admin.users.role' | t }} *</label>
          <select formControlName="role" class="form-input">
            <option [ngValue]="0">{{ 'admin.users.userRole' | t }}</option>
            <option [ngValue]="1">{{ 'admin.users.specialistRole' | t }}</option>
            <option [ngValue]="2">{{ 'admin.sidebar.role' | t }}</option>
          </select>
        </div>

        <div class="form-group toggle-wrapper" style="align-items: flex-end; padding-bottom: 0.5rem;">
          <input type="checkbox" formControlName="isActive" id="isActiveCheck">
          <label for="isActiveCheck" style="margin-bottom: 0; cursor: pointer;">{{ 'admin.users.accountActive' | t }}</label>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="goBack()">{{ 'appointments.book.cancel' | t }}</button>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isSubmitting">{{ 'profile.save' | t }}</button>
      </div>
    </form>
  </div>
</div>
