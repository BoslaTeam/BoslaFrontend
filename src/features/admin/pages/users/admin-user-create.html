<div class="user-form-page">
  <button class="back-btn" (click)="goBack()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/>
      <polyline points="12 19 5 12 12 5"/>
    </svg>
    {{ 'common.backToList' | t }}
  </button>

  <div class="form-card">
    <div class="form-header">
      <h2>{{ 'admin.users.addUserTitle' | t }}</h2>
      <p>{{ 'admin.users.createDesc' | t }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="user-form">
      <div class="form-grid">
        <div class="form-group">
          <label>{{ 'admin.users.fullNameLabel' | t }}</label>
          <input type="text" formControlName="fullName" [placeholder]="'admin.users.fullNamePlaceholder' | t" class="form-input">
        </div>

        <div class="form-group">
          <label>{{ 'auth.login.email' | t }} *</label>
          <input type="email" formControlName="email" placeholder="example@domain.com" class="form-input">
        </div>

        <div class="form-group">
          <label>{{ 'auth.login.password' | t }} *</label>
          <input type="password" formControlName="password" [placeholder]="'admin.users.passwordMinLength' | t" class="form-input">
        </div>

        <div class="form-group">
          <label>{{ 'auth.register.phone' | t }}</label>
          <input type="text" formControlName="phoneNumber" [placeholder]="'auth.register.phone' | t" class="form-input">
        </div>

        <div class="form-group">
          <label>{{ 'admin.users.country' | t }}</label>
          <input type="text" formControlName="country" [placeholder]="'admin.users.countryPlaceholder' | t" class="form-input">
        </div>

        <div class="form-group">
          <label>{{ 'admin.users.role' | t }} *</label>
          <select formControlName="role" class="form-input">
            <option [ngValue]="0">{{ 'admin.users.userRole' | t }}</option>
            <option [ngValue]="1">{{ 'admin.users.specialistRole' | t }}</option>
            <option [ngValue]="2">{{ 'admin.sidebar.role' | t }}</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="goBack()">{{ 'appointments.book.cancel' | t }}</button>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isSubmitting">
          {{ 'admin.users.addUser' | t }}
        </button>
      </div>
    </form>
  </div>
</div>
