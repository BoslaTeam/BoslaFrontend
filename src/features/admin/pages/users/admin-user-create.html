<div class="user-form-page">
  <button class="back-btn" (click)="goBack()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/>
      <polyline points="12 19 5 12 12 5"/>
    </svg>
    العودة للقائمة
  </button>

  <div class="form-card">
    <div class="form-header">
      <h2>إضافة مستخدم جديد</h2>
      <p>أدخل بيانات المستخدم الجديد أدناه. سيتم إنشاء الحساب وتفعيله تلقائياً.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="user-form">
      <div class="form-grid">
        <div class="form-group">
          <label>الاسم الكامل *</label>
          <input type="text" formControlName="fullName" placeholder="الاسم الكامل" class="form-input">
        </div>

        <div class="form-group">
          <label>البريد الإلكتروني *</label>
          <input type="email" formControlName="email" placeholder="example@domain.com" class="form-input">
        </div>

        <div class="form-group">
          <label>كلمة المرور *</label>
          <input type="password" formControlName="password" placeholder="6 أحرف على الأقل" class="form-input">
        </div>

        <div class="form-group">
          <label>رقم الهاتف</label>
          <input type="text" formControlName="phoneNumber" placeholder="رقم الهاتف" class="form-input">
        </div>

        <div class="form-group">
          <label>البلد</label>
          <input type="text" formControlName="country" placeholder="البلد" class="form-input">
        </div>

        <div class="form-group">
          <label>الدور *</label>
          <select formControlName="role" class="form-input">
            <option [ngValue]="0">مستخدم</option>
            <option [ngValue]="1">متخصص</option>
            <option [ngValue]="2">مدير</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="goBack()">إلغاء</button>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isSubmitting">
          إضافة المستخدم
        </button>
      </div>
    </form>
  </div>
</div>
