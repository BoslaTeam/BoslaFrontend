<div class="container mx-auto px-4 py-8">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-slate-800">الإشعارات</h1>
    <button *ngIf="notifications().length > 0" (click)="markAllAsRead()" class="text-sm font-semibold text-bosla-orange hover:text-orange-600 transition-colors">
      تحديد الكل كمقروء
    </button>
  </div>

  <div *ngIf="isLoading()" class="flex justify-center py-12">
    <div class="w-8 h-8 border-4 border-bosla-orange border-t-transparent rounded-full animate-spin"></div>
  </div>

  <div *ngIf="!isLoading() && notifications().length === 0" class="bg-white rounded-xl shadow-sm border border-slate-100 p-12 text-center">
    <div class="w-16 h-16 bg-slate-50 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </div>
    <h3 class="text-lg font-semibold text-slate-800 mb-2">لا توجد إشعارات</h3>
    <p class="text-slate-500">ليس لديك أي إشعارات جديدة في الوقت الحالي.</p>
  </div>

  <div *ngIf="!isLoading() && notifications().length > 0" class="flex flex-col gap-3">
    <div *ngFor="let notif of notifications()" 
         class="bg-white rounded-xl shadow-sm border p-5 transition-all flex items-start gap-4 cursor-pointer hover:shadow-md"
         [ngClass]="notif.isRead ? 'border-slate-100 opacity-70' : 'border-blue-100 bg-blue-50/30'"
         (click)="markAsRead(notif.id)">
      
      <!-- Icon depending on read status -->
      <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 mt-1"
           [ngClass]="notif.isRead ? 'bg-slate-100 text-slate-400' : 'bg-bosla-orange/10 text-bosla-orange'">
        <svg *ngIf="!notif.isRead" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <svg *ngIf="notif.isRead" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <div class="flex-grow">
        <div class="flex justify-between items-start mb-1">
          <h4 class="font-bold text-slate-800" [ngClass]="!notif.isRead ? 'text-slate-900' : 'text-slate-700'">{{ notif.title }}</h4>
          <span class="text-xs text-slate-400">{{ notif.createdAt | date:'short' }}</span>
        </div>
        <p class="text-sm text-slate-600 leading-relaxed">{{ notif.message }}</p>
      </div>
      
      <!-- Unread dot indicator -->
      <div *ngIf="!notif.isRead" class="w-3 h-3 bg-bosla-orange rounded-full mt-3 shrink-0"></div>
    </div>
  </div>
</div>
