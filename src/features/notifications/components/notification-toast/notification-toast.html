<div class="ntf-toast-container">
  @for (toast of toasts(); track toast.id) {
  <div role="alert" class="ntf-toast" [class.ntf-toast--hide]="!toast.visible" [class.ntf-toast-clickable]="!!toast.appointmentId"
    (click)="onClickToast(toast)">
    <div class="ntf-toast-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </div>
    <div class="flex-grow min-w-0">
      <p class="ntf-toast-title">{{ toast.title }}</p>
      <p class="ntf-toast-msg">{{ toast.message }}</p>
      @if (toast.appointmentId) {
        <button type="button" (click)="onClickToast(toast); $event.stopPropagation()" class="ntf-toast-btn">{{ 'notifications.viewDetails' | t }}</button>
      }
    </div>
    <button type="button" (click)="dismiss(toast.id); $event.stopPropagation()" class="ntf-toast-close" [attr.aria-label]="'common.close' | t">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
  }
</div>
