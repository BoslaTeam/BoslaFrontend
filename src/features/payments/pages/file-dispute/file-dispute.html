<div [dir]="direction()" class="min-h-screen bg-bosla-offwhite font-cairo p-6">
  <div class="max-w-lg mx-auto pt-20">

    @if (submitted()) {
      <div class="bg-white rounded-2xl shadow-xl border border-green-100 p-8 text-center">
        <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-4">
          <i class="fa-solid fa-check-circle text-3xl text-green-500"></i>
        </div>
        <h2 class="text-xl font-black text-slate-800 mb-2">تم تقديم الشكوى بنجاح</h2>
        <p class="text-slate-500 mb-6">سيتم مراجعة شكواك من قبل فريق الإدارة والرد عليك في أقرب وقت.</p>
        <a routerLink="/payments" class="text-bosla-primary font-bold underline">العودة للمعاملات المالية</a>
      </div>
    } @else {
      <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
        <h1 class="text-2xl font-black text-slate-800 mb-2">تقديم شكوى</h1>
        <p class="text-slate-500 text-sm mb-8">تقديم شكوى على معاملة مالية. سيتم مراجعة الشكوى والبت فيها من قبل الإدارة.</p>

        <div class="space-y-6">
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">سبب الشكوى *</label>
            <select [(ngModel)]="reason"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-bosla-primary focus:ring-2 focus:ring-bosla-primary/20 outline-none text-sm">
              <option value="">اختر السبب...</option>
              <option value="لم يتم تقديم الخدمة">لم يتم تقديم الخدمة</option>
              <option value="خدمة غير مطابقة للموصوف">خدمة غير مطابقة للموصوف</option>
              <option value="مشكلة في الدفع">مشكلة في الدفع</option>
              <option value="أخرى">أخرى</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">وصف تفصيلي</label>
            <textarea [(ngModel)]="description" rows="4"
                      class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-bosla-primary focus:ring-2 focus:ring-bosla-primary/20 outline-none text-sm resize-none"
                      placeholder="اكتب تفاصيل الشكوى..."></textarea>
          </div>

          <div class="flex gap-3 pt-4">
            <button (click)="submitDispute()" [disabled]="!reason.trim() || isSubmitting()"
                    class="flex-1 px-6 py-3 bg-red-500 text-white rounded-xl font-bold text-sm hover:bg-red-600 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
              @if (isSubmitting()) {
                <ui-spinner size="sm" />
              } @else {
                تقديم الشكوى
              }
            </button>
            <a routerLink="/payments"
               class="px-6 py-3 border border-slate-200 rounded-xl font-bold text-sm text-slate-600 hover:bg-slate-50 transition-all">{{ 'appointments.book.cancel' | t }}</a>
          </div>
        </div>
      </div>
    }

  </div>
</div>
