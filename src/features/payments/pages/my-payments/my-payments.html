    <div class="max-w-6xl mx-auto">

          <h1 class="text-3xl sm:text-4xl font-black text-slate-800 mb-2">المعاملات المالية</h1>
          <p class="text-sm text-slate-500">تتبع فواتيرك ومدفوعاتك السابقة بكل سهولة وشفافية.</p>
        </div>

      <!-- Table Card -->
      <div class="animate-fade-up stagger-3 bg-white/70 backdrop-blur-md rounded-[2rem] shadow-xl border border-white overflow-hidden relative">
        <div class="absolute inset-0 bg-gradient-to-br from-white/40 to-transparent pointer-events-none"></div>
        
        <div class="relative overflow-x-auto">
          <table class="w-full text-right whitespace-nowrap">
            <thead class="bg-slate-50/50 border-b border-slate-200 text-slate-500 text-[13px] uppercase tracking-wider">
              <tr>
                <th class="px-8 py-5 font-black text-right rounded-tr-[2rem]">رقم الفاتورة</th>
                <th class="px-8 py-5 font-black text-right">التفاصيل</th>
                <th class="px-8 py-5 font-black text-right">التاريخ</th>
                <th class="px-8 py-5 font-black text-right">المبلغ</th>
                <th class="px-8 py-5 font-black text-right rounded-tl-[2rem]">الحالة</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100/80 text-sm">
              @for (pay of payments; track pay.id) {
              <tr class="hover:bg-bosla-primary/5 transition-colors duration-300 group cursor-pointer">
                <td class="px-8 py-5">
                  <span class="inline-flex items-center gap-2 px-3 py-1 rounded-lg bg-slate-100 text-slate-600 font-bold font-mono text-xs border border-slate-200 group-hover:bg-white group-hover:border-bosla-primary/20 transition-colors">
                    <i class="fa-solid fa-hashtag text-slate-400 text-[10px]"></i>
                    {{ pay.id }}
                  </span>
                </td>
                <td class="px-8 py-5">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-bosla-primary/10 to-bosla-blue/10 flex items-center justify-center border border-white group-hover:border-bosla-primary/20 transition-colors shadow-sm">
                      <i class="fa-solid fa-file-invoice text-bosla-primary"></i>
                    </div>
                    <span class="font-bold text-slate-800 group-hover:text-bosla-primary transition-colors">{{ pay.description }}</span>
                  </div>
                </td>
                <td class="px-8 py-5">
                  <div class="flex items-center gap-2 text-slate-500 font-medium">
                    <i class="fa-regular fa-calendar-days text-slate-400"></i>
                    {{ pay.date | date:'dd MMM yyyy' }}
                  </div>
                </td>
                <td class="px-8 py-5">
                  <div class="flex items-center gap-1.5 font-black text-slate-800 text-base">
                    <span class="text-xs text-slate-400 font-bold">ج.م</span>
                    {{ pay.amount }}
                  </div>
                </td>
                <td class="px-8 py-5">
                  <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-black bg-gradient-to-r from-emerald-50 to-green-50 text-emerald-600 border border-emerald-100 shadow-sm">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    مكتمل
                  </span>
                </td>
              </tr>
              }
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>
