<!-- AI Smart Reply Trigger Button -->
<button
  id="ai-smart-reply-btn"
  type="button"
  class="w-8 h-8 rounded-xl flex items-center justify-center transition-all focus:outline-none focus:ring-2 focus:ring-bosla-blue/20 shrink-0 overflow-hidden"
  [class.ring-2]="isVisible()"
  [class.ring-bosla-blue]="isVisible()"
  [disabled]="isLoading()"
  (click)="toggleSuggestions()"
  aria-label="اقتراحات رد ذكي"
  title="اقتراح رد بالذكاء الاصطناعي"
>
  @if (isLoading()) {
    <!-- Spinner -->
    <svg class="animate-spin" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
    </svg>
  } @else {
    <!-- Chat bot image -->
    <img src="assets/chat.png" alt="AI" class="bot-image-ai" />
  }
</button>

<style>
  .bot-image-ai {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    animation: floatBotSmall 3s ease-in-out infinite;
  }
  @keyframes floatBotSmall {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    33% { transform: translateY(-2px) rotate(-2deg); }
    66% { transform: translateY(-1px) rotate(2deg); }
  }
</style>

<!-- Suggestion Chips Panel — positioned above the entire composer bar -->
@if (isVisible() && !isLoading()) {
  <div
    id="ai-smart-reply-panel"
    class="absolute bottom-full left-0 right-0 mb-2 px-3 z-20"
    style="animation: slideUpPanel 0.2s ease-out;"
    role="listbox"
    aria-label="ردود مقترحة"
  >
    <style>
      @keyframes slideUpPanel {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>

    <!-- Card -->
    <div class="bg-white/95 backdrop-blur-xl rounded-2xl border border-bosla-blue/10 shadow-[0_-4px_24px_rgba(27,79,114,0.10)]">

      <!-- Header -->
      <div class="flex items-center justify-between px-4 py-2.5 border-b border-bosla-blue/8">
        <div class="flex items-center gap-1.5 text-[10px] font-bold text-bosla-blue/80">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/>
          </svg>
          ردود مقترحة بالذكاء الاصطناعي
        </div>
        <button
          type="button"
          class="w-5 h-5 rounded-md flex items-center justify-center text-bosla-grey/50 hover:text-bosla-grey hover:bg-bosla-grey/10 transition-colors"
          (click)="dismiss()"
          aria-label="إغلاق الاقتراحات"
        >
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Chips -->
      <div class="flex flex-wrap gap-1.5 p-3">
        @for (reply of suggestions(); track $index) {
          <button
            type="button"
            class="px-3 py-1.5 rounded-full border border-bosla-blue/20 bg-bosla-blue/5 text-bosla-charcoal text-xs font-medium hover:bg-bosla-blue/15 hover:border-bosla-blue/40 transition-all cursor-pointer text-right leading-snug focus:outline-none focus:ring-2 focus:ring-bosla-blue/20"
            role="option"
            [attr.aria-label]="'اختر: ' + reply"
            (click)="selectReply(reply)"
          >
            {{ reply }}
          </button>
        }

        <!-- Refresh button -->
        <button
          type="button"
          class="px-3 py-1.5 rounded-full border border-bosla-grey/20 bg-white text-bosla-grey text-xs hover:text-bosla-primary hover:border-bosla-primary/20 hover:bg-bosla-primary/5 transition-all flex items-center gap-1"
          (click)="loadSuggestions()"
          title="تحديث الاقتراحات"
          aria-label="تحديث الاقتراحات"
        >
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="inline-block">
            <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          تحديث
        </button>
      </div>
    </div>
  </div>
}
