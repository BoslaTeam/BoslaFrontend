<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">

  @for (specialist of specialists; track specialist.id; let i = $index) {
  <div class="specialist-card-wrapper" [style.--animation-order]="i">
    <ui-expert-card [expert]="mapToExpertCard(specialist)" (cardClick)="detailsClick.emit($event)">
    </ui-expert-card>
  </div>
  }

</div>
