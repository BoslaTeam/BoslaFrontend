<div class="max-w-xl mx-auto">
  <div class="text-center mb-8">
    <h3 class="text-2xl font-bold text-slate-800 mb-2">الخبرات السابقة</h3>
    <p class="text-slate-500">أضف خبراتك السابقة لعرضها في ملفك التعريفي</p>
  </div>

  @if (errorMessage()) {
    <div class="mb-6 bg-red-50 border-r-4 border-red-500 p-4 rounded-l-lg flex items-start gap-3">
      <i class="fa-solid fa-circle-exclamation text-red-500 mt-0.5"></i>
      <p class="text-sm text-red-700 font-medium">{{ errorMessage() }}</p>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    <div formArrayName="experiences" class="space-y-4">
      @for (entry of experiences.controls; track $index) {
        <div [formGroupName]="$index" class="border border-slate-200 rounded-2xl p-5 space-y-4 bg-slate-50/50">
          <div class="flex justify-between items-center">
            <span class="text-sm font-bold text-slate-700">خبرة #{{ $index + 1 }}</span>
            @if (experiences.length > 1) {
              <button type="button" (click)="removeEntry($index)"
                class="text-red-500 hover:text-red-700 text-sm cursor-pointer">
                <i class="fa-solid fa-trash-can"></i>
                حذف
              </button>
            }
          </div>

          <div class="grid grid-cols-2 gap-4">
            <ui-input formControlName="jobTitle" label="المسمى الوظيفي" placeholder="مثال: مهندس برمجيات" [required]="true" />
            <ui-input formControlName="companyName" label="اسم الشركة" placeholder="مثال: شركة تقنية" [required]="true" />
          </div>

          <div class="grid grid-cols-2 gap-4">
            <ui-input formControlName="fromDate" label="تاريخ البداية" type="date" [required]="true" />
            <ui-input formControlName="toDate" label="تاريخ النهاية" type="date" />
          </div>

          <ui-textarea formControlName="description" label="الوصف" placeholder="صف مهامك وإنجازاتك في هذه الخبرة" [rows]="2" />
        </div>
      }
    </div>

    <button type="button" (click)="addEntry()"
      class="w-full py-3 border-2 border-dashed border-slate-300 rounded-2xl text-slate-500 hover:border-bosla-blue hover:text-bosla-blue transition-colors cursor-pointer font-sans font-medium text-sm">
      <i class="fa-solid fa-plus ml-1"></i>
      إضافة خبرة أخرى
    </button>

    <div class="flex justify-between pt-4">
      <ui-button variant="ghost" type="button" (btnClick)="back.emit()">
        <i class="fa-solid fa-chevron-right"></i>
        السابق
      </ui-button>
      <ui-button type="submit" [loading]="isSaving()">
        حفظ ومتابعة
        <i class="fa-solid fa-arrow-left"></i>
      </ui-button>
    </div>
  </form>
</div>
