<div class="max-w-lg mx-auto">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-bosla-orange/10 text-bosla-orange mb-4">
      <i class="fa-solid fa-star text-lg"></i>
    </div>
    <h3 class="text-2xl font-bold text-bosla-primary mb-2">{{ 'onboarding.basicInfo.title' | t }}</h3>
    <p class="text-bosla-grey">{{ 'onboarding.basicInfo.subtitle' | t }}</p>
  </div>

  @if (errorMessage()) {
    <div class="mb-6 bg-bosla-error/5 border-r-4 border-bosla-error p-4 rounded-l-lg flex items-start gap-3">
      <i class="fa-solid fa-circle-exclamation text-bosla-error mt-0.5"></i>
      <p class="text-sm text-bosla-error font-medium">{{ errorMessage() }}</p>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
    <ui-input
      formControlName="title"
      [label]="'onboarding.basicInfo.specialty' | t"
      type="text"
      [placeholder]="'onboarding.basicInfo.specialtyPlaceholder' | t"
      [required]="true"
    />

    <div class="grid grid-cols-2 gap-4">
      <div class="space-y-2">
        <ui-input
          formControlName="experienceYears"
          [label]="'onboarding.basicInfo.experienceYears' | t"
          type="number"
          [placeholder]="'onboarding.basicInfo.experiencePlaceholder' | t"
          [required]="true"
        />
      </div>
      <div class="flex flex-col justify-end pb-2">
        <label class="block text-sm font-semibold text-bosla-charcoal mb-2">{{ 'onboarding.basicInfo.levelField' | t }}</label>
        <div class="h-11 px-4 rounded-xl bg-bosla-primary/10 border border-bosla-primary/20 flex items-center">
          <span class="text-sm font-bold text-bosla-primary">{{ levelLabel() }}</span>
        </div>
      </div>
    </div>

    <ui-input
      formControlName="hourlyRate"
      [label]="'onboarding.basicInfo.hourlyRate' | t"
      type="number"
      [placeholder]="'onboarding.basicInfo.ratePlaceholder' | t"
      [required]="true"
    />

    <ui-textarea
      formControlName="bookingPolicy"
      [label]="'onboarding.basicInfo.bookingPolicy' | t"
      [placeholder]="'onboarding.basicInfo.policyPlaceholder' | t"
      [required]="true"
      [rows]="3"
    />

    <div class="flex justify-between pt-4">
      <ui-button variant="ghost" type="button" (btnClick)="back.emit()">
        <i class="fa-solid fa-chevron-right"></i>{{ 'pagination.prev' | t }}</ui-button>
      <ui-button type="submit" [loading]="isLoading()" variant="primary">
        {{ 'onboarding.basicInfo.saveNext' | t }}
        <i class="fa-solid fa-arrow-left"></i>
      </ui-button>
    </div>
  </form>
</div>
