<div class="max-w-lg mx-auto">
  <div class="text-center mb-8">
    <h3 class="text-2xl font-bold text-slate-800 mb-2">المهارات</h3>
    <p class="text-slate-500">اختر المهارات التي تمتلكها من القائمة</p>
  </div>

  @if (errorMessage()) {
    <div class="mb-6 bg-red-50 border-r-4 border-red-500 p-4 rounded-l-lg flex items-start gap-3">
      <i class="fa-solid fa-circle-exclamation text-red-500 mt-0.5"></i>
      <p class="text-sm text-red-700 font-medium">{{ errorMessage() }}</p>
    </div>
  }

  <ui-multi-select-filter
    label="المهارات"
    placeholder="اختر المهارات..."
    searchPlaceholder="ابحث عن مهارة..."
    [options]="skillOptions()"
    [ngModel]="onboardingStore.draft().skills"
    (ngModelChange)="onSelectionChange($event)"
  />

  <div class="flex justify-between pt-8">
    <ui-button variant="ghost" (btnClick)="back.emit()">
      <i class="fa-solid fa-chevron-right"></i>
      السابق
    </ui-button>
    <ui-button [loading]="isSaving()" (btnClick)="onSubmit()">
      حفظ ومتابعة
      <i class="fa-solid fa-arrow-left"></i>
    </ui-button>
  </div>
</div>
