<div class="max-w-lg mx-auto">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-bosla-blue/10 text-bosla-blue mb-4">
      <i class="fa-solid fa-lightbulb text-lg"></i>
    </div>
    <h3 class="text-2xl font-bold text-bosla-primary mb-2">{{ 'onboarding.skills.title' | t }}</h3>
    <p class="text-bosla-grey">{{ 'onboarding.skills.subtitle' | t }}</p>
  </div>

  @if (errorMessage()) {
    <div class="mb-6 bg-bosla-error/5 border-r-4 border-bosla-error p-4 rounded-l-lg flex items-start gap-3">
      <i class="fa-solid fa-circle-exclamation text-bosla-error mt-0.5"></i>
      <p class="text-sm text-bosla-error font-medium">{{ errorMessage() }}</p>
    </div>
  }

  <ui-multi-select-filter
    [label]="'onboarding.skills.field' | t"
    [placeholder]="'onboarding.skills.placeholder' | t"
    [searchPlaceholder]="'onboarding.skills.searchPlaceholder' | t"
    [options]="skillOptions()"
    [ngModel]="onboardingStore.draft().skills"
    (ngModelChange)="onSelectionChange($event)"
  />

  <div class="flex justify-between pt-8">
    <ui-button variant="ghost" (btnClick)="back.emit()">
      <i class="fa-solid fa-chevron-right"></i>{{ 'pagination.prev' | t }}</ui-button>
    <ui-button [loading]="isSaving()" (btnClick)="onSubmit()">
      {{ 'onboarding.skills.saveNext' | t }}
      <i class="fa-solid fa-arrow-left"></i>
    </ui-button>
  </div>
</div>
