<div class="w-full" [dir]="direction()">
  <div class="flex items-center justify-between mb-2">
    @for (step of steps(); track step.index; let last = $last) {
      <div class="flex items-center flex-1">
        <div class="flex flex-col items-center">
          <div
            class="w-9 h-9 rounded-full flex items-center justify-center text-sm font-bold font-sans transition-all duration-300"
            [class]="step.isCompleted
              ? 'bg-bosla-success text-white'
              : step.isActive
                ? 'bg-bosla-primary text-white ring-4 ring-bosla-primary/20 scale-110'
                : 'bg-bosla-charcoal/10 text-bosla-charcoal/40'"
          >
            @if (step.isCompleted) {
              <i class="fa-solid fa-check text-xs"></i>
            } @else {
              <i class="{{ step.icon }} text-xs"></i>
            }
          </div>
          <span
            class="text-xs font-sans mt-1.5 whitespace-nowrap transition-all duration-300"
            [class]="step.isActive
              ? 'text-bosla-primary font-bold scale-105'
              : step.isCompleted
                ? 'text-bosla-success'
                : 'text-bosla-charcoal/40'"
          >
            {{ step.title }}
          </span>
        </div>
        @if (!last) {
          <div class="flex-1 h-0.5 mx-3 rounded-full transition-colors duration-300 relative overflow-hidden"
            [class]="step.isCompleted ? 'bg-bosla-success' : 'bg-bosla-charcoal/10'">
            @if (step.isActive) {
              <div class="absolute inset-0 bg-bosla-primary/30 animate-pulse rounded-full"></div>
            }
          </div>
        }
      </div>
    }
  </div>
  <!-- Progress track -->
  <div class="w-full h-1 bg-bosla-charcoal/5 rounded-full overflow-hidden">
    <div class="h-full bg-gradient-to-l from-bosla-primary to-bosla-blue rounded-full transition-all duration-500 ease-out"
      [style.width.%]="progressPercent()">
    </div>
  </div>
</div>
