<div class="bg-white/80 backdrop-blur-xl border border-white rounded-[2rem] p-4 shadow-[0_8px_40px_rgba(27,79,114,0.06)]">
  <form [formGroup]="form" class="flex flex-col gap-4">
    
    <!-- Top Search Bar -->
    <div class="flex flex-col md:flex-row items-center gap-3">
      <div class="flex-1 relative w-full">
        <div class="absolute right-5 top-1/2 -translate-y-1/2 w-10 h-10 bg-[#1B4F72]/5 rounded-full flex items-center justify-center">
            <i class="fa-solid fa-magnifying-glass text-[#1B4F72]"></i>
        </div>
        <input type="text" formControlName="searchTerm" [placeholder]="'specialists.filters.searchPlaceholder' | t"
          class="w-full h-16 pr-16 pl-6 bg-transparent border-2 border-slate-100 rounded-[1.5rem] text-lg text-[#1B4F72] font-semibold placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:border-[#F39C12] focus:bg-white transition-all shadow-inner" />
      </div>

      <div class="flex items-center gap-3 w-full md:w-auto">
        <button type="button" (click)="applyFilters()"
          class="flex-1 md:flex-none h-16 px-10 rounded-[1.5rem] text-lg font-bold text-white bg-gradient-to-l from-[#1B4F72] to-[#2E86AB] transition-all hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-[#1B4F72]/20 flex items-center justify-center gap-2">
          <span>{{ 'common.search' | t }}</span>
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </button>

        <button type="button" (click)="resetFilters()" [title]="'specialists.filters.resetTitle' | t"
          class="h-16 w-16 flex items-center justify-center rounded-[1.5rem] border-2 border-slate-100 text-slate-400 hover:text-[#e74c3c] hover:border-[#e74c3c]/30 hover:bg-[#e74c3c]/5 transition-all active:scale-[0.95]">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </div>

    <!-- Divider -->
    <div class="h-px w-full bg-gradient-to-r from-transparent via-slate-200 to-transparent my-2"></div>

    <!-- Dropdowns & Ranges -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
      
      <!-- Selectors -->
      <div class="relative group">
        <i class="fa-solid fa-briefcase absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#F39C12] transition-colors"></i>
        <select formControlName="expertiseId" class="w-full h-12 pr-10 pl-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-[#1B4F72] focus:outline-none focus:border-[#F39C12] focus:ring-1 focus:ring-[#F39C12] appearance-none cursor-pointer transition-all">
          <option value="">{{ 'specialists.filters.allExpertise' | t }}</option>
          @for (item of expertise; track item.id) {
            <option [value]="item.id">{{ item.name }}</option>
          }
        </select>
        <i class="fa-solid fa-chevron-down absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
      </div>

      <div class="relative group">
        <i class="fa-solid fa-star absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#F39C12] transition-colors"></i>
        <select formControlName="skillId" class="w-full h-12 pr-10 pl-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-[#1B4F72] focus:outline-none focus:border-[#F39C12] focus:ring-1 focus:ring-[#F39C12] appearance-none cursor-pointer transition-all">
          <option value="">{{ 'specialists.filters.allSkills' | t }}</option>
          @for (item of skills; track item.id) {
            <option [value]="item.id">{{ item.name }}</option>
          }
        </select>
        <i class="fa-solid fa-chevron-down absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
      </div>

      <div class="relative group">
        <i class="fa-solid fa-wrench absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#F39C12] transition-colors"></i>
        <select formControlName="toolId" class="w-full h-12 pr-10 pl-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-[#1B4F72] focus:outline-none focus:border-[#F39C12] focus:ring-1 focus:ring-[#F39C12] appearance-none cursor-pointer transition-all">
          <option value="">{{ 'specialists.filters.allTools' | t }}</option>
          @for (item of tools; track item.id) {
            <option [value]="item.id">{{ item.name }}</option>
          }
        </select>
        <i class="fa-solid fa-chevron-down absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
      </div>

      <div class="relative group">
        <i class="fa-solid fa-layer-group absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#F39C12] transition-colors"></i>
        <select formControlName="experienceLevel" class="w-full h-12 pr-10 pl-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-[#1B4F72] focus:outline-none focus:border-[#F39C12] focus:ring-1 focus:ring-[#F39C12] appearance-none cursor-pointer transition-all">
          <option [ngValue]="null">{{ 'specialists.filters.anyLevel' | t }}</option>
          <option [ngValue]="1">{{ 'specialists.filters.levelBeginner' | t }}</option>
          <option [ngValue]="2">{{ 'common.average.mtwst' | t }}</option>
          <option [ngValue]="3">{{ 'specialists.filters.levelAdvanced' | t }}</option>
          <option [ngValue]="4">{{ 'auth.register.roleSpecialist' | t }}</option>
        </select>
        <i class="fa-solid fa-chevron-down absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
      </div>

      <!-- Price Range -->
      <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl p-1">
        <div class="relative flex-1">
          <input type="number" formControlName="minHourlyRate" [placeholder]="'specialists.filters.minPrice' | t"
            class="w-full h-10 px-3 bg-white border border-transparent rounded-lg text-sm text-[#1B4F72] font-semibold text-center placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:border-[#F39C12] transition-all" />
        </div>
        <span class="text-slate-300">-</span>
        <div class="relative flex-1">
          <input type="number" formControlName="maxHourlyRate" [placeholder]="'specialists.filters.maxPrice' | t"
            class="w-full h-10 px-3 bg-white border border-transparent rounded-lg text-sm text-[#1B4F72] font-semibold text-center placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:border-[#F39C12] transition-all" />
        </div>
      </div>

    </div>

  </form>
</div>
