<section class="relative z-10 pt-32 pb-16" dir="rtl">

    <div class="container mx-auto px-6">

        <!-- Hero -->
        <div class="text-center max-w-4xl mx-auto mb-12">

            <span
                class="inline-flex items-center gap-2 px-5 py-2 rounded-full bg-white/10 backdrop-blur-md border border-white/10 text-bosla-orange font-bold mb-6">
                <i class="fa-solid fa-compass"></i>
                نخبة الخبراء والمتخصصين
            </span>

            <h1 class="text-5xl md:text-6xl font-black text-white leading-tight mb-6">
                ابحث عن
                <span class="text-bosla-orange">
                    المتخصص المناسب
                </span>
                لك
            </h1>

            <p class="text-lg text-white/70 max-w-2xl mx-auto leading-relaxed">
                تواصل مع مستشارين وخبراء موثوقين في مختلف المجالات واحجز جلسات استشارية بسهولة.
            </p>

        </div>

        <!-- Filters -->
        <div class="mb-10">
            <specialist-filters [expertise]="store.expertise()" [skills]="store.skills()" [tools]="store.tools()"
                (filtersChanged)="onFiltersChanged($event)">
            </specialist-filters>
        </div>

        <!-- Loading -->
        @if (store.loading()) {

        <div class="flex justify-center py-20">
            <div class="animate-spin w-12 h-12 border-4 border-white/20 border-t-bosla-orange rounded-full">
            </div>
        </div>

        }

        <!-- Empty -->
        @else if (store.isEmpty()) {

        <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-10">

            <ui-empty-state title="لا يوجد متخصصون" description="لم يتم العثور على نتائج مطابقة للفلاتر المحددة">
            </ui-empty-state>

        </div>

        }

        <!-- Results -->
        @else {

        <!-- Results Header -->
        <div class="flex items-center justify-between mb-8">

            <h2 class="text-white font-black text-2xl">
                المتخصصون
            </h2>

            <div
                class="px-4 py-2 rounded-full bg-white/10 border border-white/10 text-white/80 text-sm backdrop-blur-md">

                الصفحة {{ store.currentPage() }}
                من
                {{ store.totalPages() }}

            </div>

        </div>

        <!-- Grid -->
        <specialists-grid [specialists]="store.specialists()" (detailsClick)="onSpecialistSelected($event)">
        </specialists-grid>

        <!-- Pagination -->
        <div class="mt-12 flex justify-center p-6 rounded-3xl bg-white/5 backdrop-blur-xl border border-white/10">

            <ui-pagination [currentPage]="store.currentPage()" [totalPages]="store.totalPages()"
                (pageChange)="onPageChanged($event)">
            </ui-pagination>

        </div>

        }

    </div>

</section>
