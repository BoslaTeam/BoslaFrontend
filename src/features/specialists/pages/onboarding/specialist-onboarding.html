<div [dir]="direction()" class="min-h-[calc(100vh-80px)] bg-bosla-offwhite flex items-start justify-center p-4 md:p-8">
  <div class="w-full max-w-4xl bg-white rounded-3xl shadow-lg border border-bosla-charcoal/5 p-8 md:p-10 mt-20">
    <!-- Brand Header -->
    <div class="text-center mb-6">
      <div
        class="inline-flex items-center gap-2 bg-bosla-primary/5 text-bosla-primary px-4 py-1.5 rounded-full text-sm font-semibold mb-2">
        <i class="fa-regular fa-compass"></i>
        {{ 'onboarding.joinBosla' | t }}
      </div>
      <h1 class="text-2xl md:text-3xl font-bold text-bosla-primary">{{ 'onboarding.startJourney' | t }}</h1>
      <p class="text-bosla-grey mt-1">{{ 'onboarding.journeyDesc' | t }}</p>
    </div>

    <onboarding-stepper [currentStep]="onboardingStore.currentStep()" [totalSteps]="onboardingStore.totalSteps()"
      [titles]="stepTitleLabels()" [icons]="stepIcons" />

    <div class="mt-8">
      @switch (onboardingStore.currentStep()) {
      @case (0) {
      <documents-step (completed)="onboardingStore.nextStep()" (back)="onboardingStore.previousStep()" />
      }
      @case (1) {
      <experience-step (completed)="onboardingStore.nextStep()" (back)="onboardingStore.previousStep()" />
      }
      @case (2) {
      <basic-info-step (completed)="onboardingStore.nextStep()" (back)="onboardingStore.previousStep()" />
      }
      @case (3) {
      <skills-step (completed)="onboardingStore.nextStep()" (back)="onboardingStore.previousStep()" />
      }
      @case (4) {
      <tools-step (completed)="onboardingStore.nextStep()" (back)="onboardingStore.previousStep()" />
      }
      @case (5) {
      <availability-step (completed)="onAvailabilityCompleted()" (back)="onboardingStore.previousStep()" />
      }
      @case (6) {
      <submit-step (back)="onboardingStore.previousStep()" />
      }
      }
    </div>
  </div>
</div>
