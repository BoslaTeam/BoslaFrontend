@if (!isSpecialist()) {
<div class="relative overflow-hidden rounded-3xl bg-linear-to-br from-bosla-primary to-[#235d88] p-8 text-white shadow-xl">
  <div class="absolute -top-12 -right-12 w-40 h-40 bg-white opacity-10 rounded-full blur-2xl"></div>
  <div class="relative z-10">
    <div class="w-14 h-14 bg-white/20 backdrop-blur-xs rounded-2xl flex items-center justify-center mb-6">
      <svg class="w-7 h-7 text-bosla-orange" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
      </svg>
    </div>
    <h3 class="text-2xl font-bold mb-2">هل أنت محترف؟</h3>
    <p class="text-white/80 mb-6 leading-relaxed">انضم إلى شبكة الخبراء لدينا وقدم استشاراتك لمئات المستفيدين.</p>
    <a routerLink="/become-specialist"
      class="block w-full py-3 px-4 bg-bosla-orange hover:bg-orange-500 text-white text-center font-bold rounded-xl transition-all shadow-lg hover:-translate-y-0.5">
      انضم كاختصاصي الآن
    </a>
  </div>
</div>
} @else {
<div class="bg-white rounded-3xl p-8 border border-slate-100 shadow-sm text-center">
  <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-100">
    <svg class="w-8 h-8 text-bosla-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
    </svg>
  </div>
  <h3 class="text-xl font-bold text-slate-800 mb-2">لوحة تحكم الاختصاصي</h3>
  <p class="text-slate-500 text-sm mb-6">أنت مسجل كاختصاصي. يمكنك إدارة حجوزاتك واستشاراتك من لوحة التحكم الخاصة بك.</p>
  <a routerLink="/specialist"
    class="block w-full py-3 px-4 bg-slate-800 hover:bg-slate-900 text-white text-center font-bold rounded-xl transition-all">
    الانتقال للوحة التحكم
  </a>
</div>
}
