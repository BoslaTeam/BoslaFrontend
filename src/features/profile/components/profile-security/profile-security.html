<div class="bg-white rounded-3xl p-6 md:p-8 border border-slate-100 shadow-sm">
  <div class="flex items-center gap-3 mb-6">
    <div class="bg-slate-100 p-2.5 rounded-lg">
      <svg class="w-6 h-6 text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
    </div>
    <h3 class="text-xl font-bold text-slate-800">إعدادات الأمان</h3>
  </div>

  <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
    <div class="grid grid-cols-1 gap-5">
      <div class="space-y-2">
        <label class="block text-sm font-semibold text-slate-700">كلمة المرور الحالية (اختياري)</label>
        <input type="password" formControlName="currentPassword" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:ring-2 focus:ring-bosla-primary/20 focus:border-bosla-primary outline-none transition-all md:w-1/2" placeholder="••••••••">
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="space-y-2">
          <label class="block text-sm font-semibold text-slate-700">كلمة المرور الجديدة</label>
          <input type="password" formControlName="newPassword" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:ring-2 focus:ring-bosla-primary/20 focus:border-bosla-primary outline-none transition-all" placeholder="••••••••">
          @if(passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid) {
            <p class="text-xs text-red-500 font-medium">يجب أن تحتوي على 8 أحرف على الأقل، حرف كبير وصغير ورقم.</p>
          }
        </div>
        <div class="space-y-2">
          <label class="block text-sm font-semibold text-slate-700">تأكيد كلمة المرور الجديدة</label>
          <input type="password" formControlName="confirmNewPassword" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:ring-2 focus:ring-bosla-primary/20 focus:border-bosla-primary outline-none transition-all" placeholder="••••••••">
          @if(passwordForm.get('confirmNewPassword')?.touched && passwordForm.hasError('passwordMismatch')) {
            <p class="text-xs text-red-500 font-medium">كلمات المرور غير متطابقة.</p>
          }
        </div>
      </div>
    </div>
    <div class="mt-6 flex justify-end pt-4 border-t border-slate-100">
      <button type="submit" [disabled]="passwordForm.invalid" class="py-2.5 px-6 border-2 border-slate-200 hover:border-slate-800 hover:bg-slate-50 text-slate-800 font-bold rounded-xl transition-all disabled:opacity-50">
        تحديث كلمة المرور
      </button>
    </div>
  </form>
</div>
