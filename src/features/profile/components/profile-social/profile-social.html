<div class="bg-white rounded-3xl p-6 md:p-8 border border-slate-100 shadow-sm">
  <div class="flex items-center gap-3 mb-6">
    <div class="bg-blue-50 p-2.5 rounded-lg">
      <svg class="w-6 h-6 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
      </svg>
    </div>
    <h3 class="text-xl font-bold text-slate-800">الروابط الاجتماعية</h3>
  </div>

  <div class="mb-8">
    @if (socialLinks().length === 0) {
      <div class="text-center py-6 bg-slate-50 border border-dashed border-slate-300 rounded-xl">
        <p class="text-slate-500">لم تقم بإضافة روابط اجتماعية.</p>
      </div>
    }
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      @for (link of socialLinks(); track link.id) {
        <div class="flex items-center justify-between p-3.5 border border-slate-100 rounded-xl hover:border-slate-200 transition-colors bg-white">
          <div class="overflow-hidden">
            <h4 class="font-bold text-slate-800 text-sm">{{link.platform}}</h4>
            <a [href]="link.url" target="_blank" class="text-xs text-blue-500 hover:underline truncate block mt-0.5" dir="ltr">{{link.url}}</a>
          </div>
          <button (click)="deleteSocialLink(link.id)" class="p-1.5 shrink-0 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-md transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      }
    </div>
  </div>

  <form [formGroup]="socialLinkForm" (ngSubmit)="addSocialLink()" class="bg-slate-50 p-6 rounded-2xl border border-slate-100">
    <h4 class="font-bold text-slate-800 mb-5 flex items-center gap-2">
      <svg class="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      إضافة رابط جديد
    </h4>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-slate-600">المنصة</label>
        <input type="text" formControlName="platform" placeholder="LinkedIn, X, Website..." class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-bosla-primary/20 outline-none" dir="ltr" style="text-align: right;">
      </div>
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-slate-600">الرابط (URL)</label>
        <input type="url" formControlName="url" placeholder="https://..." class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-bosla-primary/20 outline-none" dir="ltr">
      </div>
    </div>
    <div class="mt-5 flex justify-end">
      <button type="submit" [disabled]="socialLinkForm.invalid" class="py-2 px-5 bg-slate-800 hover:bg-slate-900 text-white text-sm font-bold rounded-lg transition-all disabled:opacity-50">
        إضافة الرابط
      </button>
    </div>
  </form>
</div>
