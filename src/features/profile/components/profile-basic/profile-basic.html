<div class="flex flex-col items-center text-center">
  <div class="relative group cursor-pointer mb-4">
    <div class="w-28 h-28 rounded-full overflow-hidden border-4 border-white shadow-md bg-slate-100 flex items-center justify-center relative">
      @if (avatarPreviewUrl && !profileImageError) {
        <img [src]="avatarPreviewUrl" alt="Profile avatar" class="w-full h-full object-cover" (error)="onProfileImageError()">
      } @else {
        <svg class="w-14 h-14 text-slate-300" fill="currentColor" viewBox="0 0 24 24">
          <path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      }
      <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
        <i class="fa-solid fa-camera text-white text-xl"></i>
      </div>
    </div>
    <input type="file" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" (change)="onAvatarSelected($event)">
  </div>

  <h1 class="text-2xl font-black text-bosla-primary">{{ profile?.name || 'مستخدم جديد' }}</h1>
  <p class="text-bosla-charcoal/70 mt-1 max-w-md line-clamp-1">{{ profile?.title || 'قم بإضافة المسمى الوظيفي' }}</p>
</div>

<div class="bg-white rounded-3xl p-6 md:p-8 border border-slate-100 shadow-sm mt-8">
  <div class="flex items-center gap-3 mb-6">
    <div class="bg-bosla-primary/10 p-2.5 rounded-lg">
      <svg class="w-6 h-6 text-bosla-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
    </div>
    <h3 class="text-xl font-bold text-slate-800">المعلومات الشخصية</h3>
  </div>

  <form [formGroup]="basicInfoForm" (ngSubmit)="updateBasicInfo()">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div class="space-y-2 md:col-span-2">
        <label class="block text-sm font-semibold text-slate-700">الاسم بالكامل</label>
        <input type="text" formControlName="name" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:ring-2 focus:ring-bosla-primary/20 focus:border-bosla-primary outline-none transition-all">
      </div>
      <div class="space-y-2 md:col-span-2">
        <label class="block text-sm font-semibold text-slate-700">المسمى الوظيفي / اللقب (Title)</label>
        <input type="text" formControlName="title" placeholder="مثال: استشاري أسري، مطور برمجيات..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:ring-2 focus:ring-bosla-primary/20 focus:border-bosla-primary outline-none transition-all">
      </div>
      <div class="space-y-2 md:col-span-2">
        <label class="block text-sm font-semibold text-slate-700">نبذة تعريفية (Bio)</label>
        <textarea formControlName="bio" rows="3" placeholder="تحدث عن نفسك وخبراتك باختصار..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:ring-2 focus:ring-bosla-primary/20 focus:border-bosla-primary outline-none transition-all resize-y"></textarea>
      </div>
      <div class="space-y-2">
        <label class="block text-sm font-semibold text-slate-700">رقم الهاتف</label>
        <input type="text" formControlName="phoneNumber" dir="ltr" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:ring-2 focus:ring-bosla-primary/20 focus:border-bosla-primary outline-none transition-all text-right">
      </div>
      <div class="space-y-2">
        <label class="block text-sm font-semibold text-slate-700">الدولة</label>
        <input type="text" formControlName="country" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:ring-2 focus:ring-bosla-primary/20 focus:border-bosla-primary outline-none transition-all">
      </div>
      <div class="space-y-2">
        <label class="block text-sm font-semibold text-slate-700">الجنس</label>
        <select formControlName="gender" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:ring-2 focus:ring-bosla-primary/20 focus:border-bosla-primary outline-none transition-all appearance-none">
          <option value="" disabled selected>اختر الجنس</option>
          <option value="male">ذكر</option>
          <option value="female">أنثى</option>
        </select>
      </div>
      <div class="space-y-2">
        <label class="block text-sm font-semibold text-slate-700">اللغة المفضلة</label>
        <select formControlName="preferredLanguage" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:ring-2 focus:ring-bosla-primary/20 focus:border-bosla-primary outline-none transition-all appearance-none">
          <option value="" disabled selected>اختر اللغة</option>
          <option value="ar">العربية (Arabic)</option>
          <option value="en">الإنجليزية (English)</option>
        </select>
      </div>
    </div>
    <div class="mt-6 flex justify-end pt-4 border-t border-slate-100">
      <button type="submit" [disabled]="basicInfoForm.invalid" class="py-2.5 px-6 bg-bosla-primary hover:bg-[#154360] text-white font-bold rounded-xl transition-all disabled:opacity-50">
        حفظ التغييرات
      </button>
    </div>
  </form>
</div>
