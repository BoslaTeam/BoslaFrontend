<header class="relative h-20 flex items-center justify-between px-6">
  <div class="flex items-center gap-6">
    <a routerLink="/specialist">
      <ui-logo></ui-logo>
    </a>
    <nav class="hidden md:flex items-center gap-4 text-sm text-white/80">
      <a routerLink="/specialist" routerLinkActive="text-white font-bold" [routerLinkActiveOptions]="{exact: true}" class="hover:text-white transition-colors">لوحة التحكم</a>
      <a routerLink="/specialist/profile" routerLinkActive="text-white font-bold" class="hover:text-white transition-colors">الملف الشخصي</a>
    </nav>
  </div>

  <div class="flex items-center gap-4">
    <div class="flex items-center gap-3 text-white">
      <div class="text-left">
        <p class="text-sm font-bold leading-tight">{{ authService.currentUser()?.fullName }}</p>
        <p class="text-xs text-white/60">اختصاصي</p>
      </div>
      <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-white/30 bg-white/20 flex items-center justify-center">
        @if (authService.currentUser()?.avatarUrl && !avatarError) {
          <img [src]="authService.currentUser()?.avatarUrl" alt="avatar" class="w-full h-full object-cover" (error)="onAvatarError()">
        } @else {
          <svg class="w-5 h-5 text-white/60" fill="currentColor" viewBox="0 0 24 24">
            <path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        }
      </div>
    </div>
    <button (click)="logout()" class="p-2 text-white/60 hover:text-white hover:bg-white/10 rounded-lg transition-colors" title="تسجيل الخروج">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
    </button>
  </div>
</header>
