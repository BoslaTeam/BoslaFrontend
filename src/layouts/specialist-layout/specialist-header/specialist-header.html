<header
  class="h-16 bg-white border-b border-slate-100 flex items-center justify-between px-6 sticky top-0 z-40 shadow-sm">

  <div>
    <h1 class="text-sm font-medium text-slate-700">
      Welcome, Dr. <span class="font-semibold text-slate-900">{{ authService.currentUser()?.fullName ?? 'Specialist'
        }}</span> 💼
    </h1>
  </div>

  <div class="flex items-center">
    <button type="button" (click)="authService.logout()"
      class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-red-600 hover:text-red-700 hover:bg-red-50 rounded-xl transition-all duration-200 group">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
        class="w-4 h-4 mr-2 text-red-500 group-hover:text-red-600 transition-colors">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
      </svg>
      Logout
    </button>
  </div>

</header>
