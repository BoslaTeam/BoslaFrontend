<header class="fixed top-0 left-0 w-full z-50 bg-bosla-primary shadow-md">
  <div class="container mx-auto px-4 h-20 flex items-center justify-between">
    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2 group">
      <ui-logo size="lg"></ui-logo>
    </a>

    <!-- Navigation -->
    <nav class="hidden md:flex items-center gap-6 font-bold text-white/85">
      <a routerLink="/specialist/dashboard" routerLinkActive="text-bosla-orange" [routerLinkActiveOptions]="{exact: true}"
        class="hover:text-bosla-orange transition-colors text-sm">لوحة التحكم</a>
      <a routerLink="/specialist/appointments" routerLinkActive="text-bosla-orange"
        class="hover:text-bosla-orange transition-colors text-sm">المواعيد</a>
      <a routerLink="/specialist/availability" routerLinkActive="text-bosla-orange"
        class="hover:text-bosla-orange transition-colors text-sm">التوافر</a>
      <a routerLink="/specialist/profile" routerLinkActive="text-bosla-orange"
        class="hover:text-bosla-orange transition-colors text-sm">الملف الشخصي</a>
    </nav>

    <!-- Actions -->
    <div class="flex items-center gap-3">

      <!-- Messages Icon -->
      <a routerLink="/specialist/chat" class="relative text-white/80 hover:text-bosla-orange transition-colors w-9 h-9 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10" title="الرسائل">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="absolute top-1.5 right-1.5 flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-bosla-orange opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-bosla-orange"></span>
        </span>
      </a>

      <!-- Notifications Icon -->

      <!-- User Dropdown -->
      <div class="relative specialist-dropdown-container">
        <button (click)="toggleDropdown()" title="قائمة الاختصاصي"
          class="flex items-center justify-center w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 text-white transition-all border border-white/10 hover:border-white/30 overflow-hidden cursor-pointer focus:outline-none">
          @if (authService.currentUser()?.avatarUrl && !avatarError) {
            <img [src]="authService.currentUser()?.avatarUrl" alt="Profile" class="w-full h-full object-cover"
              (error)="onAvatarError()">
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          }
        </button>

        <!-- Dropdown Menu -->
        @if (isDropdownOpen()) {
          <div class="absolute left-0 mt-3 w-56 bg-white rounded-xl shadow-2xl py-2 z-50 border border-slate-100 flex flex-col transform origin-top-left transition-all duration-200">
            
            <!-- User Info Header -->
            <div class="px-4 py-3 border-b border-slate-100">
              <p class="text-sm font-bold text-slate-800 truncate">{{ authService.currentUser()?.fullName || 'اختصاصي' }}</p>
              <p class="text-xs text-slate-500 truncate mt-0.5">{{ authService.currentUser()?.email || '' }}</p>
              <span class="inline-block mt-1.5 px-2 py-0.5 bg-bosla-primary/10 text-bosla-primary text-[10px] font-bold rounded-md">اختصاصي</span>
            </div>

            <!-- Specialist Links -->
            <a routerLink="/specialist/dashboard" (click)="closeDropdown()" class="px-4 py-2.5 text-sm text-slate-600 hover:text-bosla-primary hover:bg-slate-50 flex items-center gap-3 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
              لوحة التحكم
            </a>
            
            <a routerLink="/specialist/profile" (click)="closeDropdown()" class="px-4 py-2.5 text-sm text-slate-600 hover:text-bosla-primary hover:bg-slate-50 flex items-center gap-3 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              الإعدادات والملف الشخصي
            </a>

            <a routerLink="/specialist/appointments" (click)="closeDropdown()" class="px-4 py-2.5 text-sm text-slate-600 hover:text-bosla-primary hover:bg-slate-50 flex items-center gap-3 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              سجل المواعيد
            </a>

            <a routerLink="/specialist/earnings" (click)="closeDropdown()" class="px-4 py-2.5 text-sm text-slate-600 hover:text-bosla-primary hover:bg-slate-50 flex items-center gap-3 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
              الأرباح والمعاملات
            </a>

            <div class="h-px bg-slate-100 my-1"></div>

            <!-- Logout -->
            <button (click)="logout(); closeDropdown()"
              class="w-full text-right px-4 py-2.5 text-sm font-semibold text-red-500 hover:bg-red-50 hover:text-red-600 flex items-center gap-3 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
              تسجيل الخروج
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</header>
