<aside class="specialist-sidebar" [class.collapsed]="isCollapsed()" [class.mobile-open]="isMobileOpen()">

  <!-- Logo + Toggle -->
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <svg class="sidebar-logo-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 19 21 12 17 5 21 12 2" />
      </svg>
      <span class="sidebar-logo-text">{{ 'specialist.sidebar.bosla' | t }}</span>
    </div>
    <button class="sidebar-collapse-btn" (click)="toggleCollapse.emit()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6" />
      </svg>
    </button>
  </div>

  <div class="sidebar-slogan">{{ 'specialist.sidebar.slogan' | t }}</div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    @for (item of navItems(); track item.route) {
    <a class="sidebar-nav-item" [routerLink]="item.route" routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: item.route === '/specialist/dashboard' }" (click)="onNavClick()">
      <span class="sidebar-nav-icon" [innerHTML]="item.icon"></span>
      <span class="sidebar-nav-label">{{ item.label }}</span>
    </a>
    }
  </nav>
</aside>
