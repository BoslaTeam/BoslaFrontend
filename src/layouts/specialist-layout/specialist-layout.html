<div dir="rtl" class="min-h-screen flex flex-col bg-slate-50 text-slate-800 relative">
  
  <div class="fixed top-0 left-0 w-full h-20 bg-bosla-primary z-40 shadow-md"></div>
  <div class="z-50">
    <app-specialist-header></app-specialist-header>
  </div>

  <div class="flex grow pt-20 relative z-10 min-h-screen">
    
    <aside class="hidden lg:flex w-70 shrink-0 flex-col border-l border-slate-200 bg-white">
      
      <div class="p-8">
        <h2 class="text-3xl font-bold text-indigo-600">بوصلة</h2>
        <p class="mt-2 text-sm text-slate-500">بوابتك المهنية</p>
      </div>

      <nav class="px-4 flex-1">
        <a class="mb-2 flex items-center rounded-2xl bg-indigo-600 px-5 py-4 font-medium text-white cursor-pointer">
          لوحة التحكم
        </a>
        <a class="mb-2 flex items-center rounded-2xl px-5 py-4 text-slate-600 hover:bg-slate-100 cursor-pointer">
          المواعيد
        </a>
        <a class="mb-2 flex items-center rounded-2xl px-5 py-4 text-slate-600 hover:bg-slate-100 cursor-pointer">
          التوافر
        </a>
        <a class="mb-2 flex items-center rounded-2xl px-5 py-4 text-slate-600 hover:bg-slate-100 cursor-pointer">
          الرسائل
        </a>
        <a class="mb-2 flex items-center rounded-2xl px-5 py-4 text-slate-600 hover:bg-slate-100 cursor-pointer">
          التحليلات
        </a>
        <a class="mb-2 flex items-center rounded-2xl px-5 py-4 text-slate-600 hover:bg-slate-100 cursor-pointer">
          الإعدادات
        </a>
      </nav>

      <div class="mt-auto px-6 pb-8">
        <div class="border-t pt-6">
          <div class="flex items-center gap-3">
            <div class="h-12 w-12 overflow-hidden rounded-full bg-slate-200">
              @if (profile()?.profileImageUrl) {
                <img [src]="profile()?.profileImageUrl" [alt]="profile()?.name" class="h-12 w-12 rounded-full object-cover">
              } @else {
                <div class="flex h-12 w-12 items-center justify-center rounded-full bg-indigo-600 text-white">
                  {{ profile()?.name?.charAt(0) }}
                </div>
              }
            </div>
            <div>
              <h3 class="font-semibold">{{ profile()?.name }}</h3>
              @if(profile()?.title){
                <p class="text-sm text-slate-500">{{ profile()?.title }}</p>
              }
            </div>
          </div>
        </div>
      </div>

    </aside>

    <main class="grow flex flex-col min-w-0">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
