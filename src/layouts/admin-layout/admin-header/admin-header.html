<header class="admin-header">
  <!-- Start: Toggle + Title -->
  <div class="header-start">
    <button class="header-toggle-btn" (click)="toggleSidebar.emit()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="15" y2="12"/>
        <line x1="3" y1="18" x2="18" y2="18"/>
      </svg>
    </button>
    <div>
      <div class="header-page-title">لوحة التحكم</div>
      <div class="header-page-subtitle">إدارة منصة بوصلة</div>
    </div>
  </div>

  <!-- Center: Search -->
  <div class="header-search">
    <div class="header-search-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </div>
    <input type="text" class="header-search-input" placeholder="بحث في لوحة التحكم...">
  </div>

  <!-- End: Actions -->
  <div class="header-end">
    <!-- Notifications -->
    <!-- <button class="header-icon-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="header-notification-badge"></span>
    </button> -->

    <!-- User Menu -->
    <div class="header-dropdown-wrapper">
      <button class="header-user-btn" (click)="toggleDropdown()">
        <div class="header-user-avatar">{{ userInitials() }}</div>
        <span class="header-user-name">{{ currentUser()?.fullName ?? 'مدير' }}</span>
        <svg class="header-user-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      @if (dropdownOpen()) {
        <div class="header-dropdown">
          <div class="header-dropdown-divider"></div>
          <button class="header-dropdown-item danger" (click)="onLogout()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            تسجيل الخروج
          </button>
        </div>
      }
    </div>
  </div>
</header>
