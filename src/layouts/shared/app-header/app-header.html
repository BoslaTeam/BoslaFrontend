<div class="header-root" [class.dashboard]="variant === 'dashboard'" [class.public]="variant === 'public'" [class.scrolled]="isSolidBackground">
  <div class="header-pill">

    <!-- Logo -->
    <a [routerLink]="navigationService.homeRoute" class="flex items-center gap-2 shrink-0 z-10">
      <ui-logo size="md"></ui-logo>
    </a>

    <!-- Desktop Navigation (center) -->
    <app-main-navigation />

    <!-- Actions (right) -->
    <div class="flex items-center gap-3">
      <app-header-actions />
    </div>

    <!-- Mobile toggle -->
    @if (variant === 'dashboard') {
      <button (click)="onToggleSidebar()"
        class="lg:hidden flex items-center justify-center w-9 h-9 rounded-full text-white hover:bg-white/10 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
    }
    <app-mobile-menu />

  </div>
</div>
