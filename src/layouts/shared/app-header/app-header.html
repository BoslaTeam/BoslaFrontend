<header class="fixed top-0 left-0 w-full z-50 transition-all duration-300"
  [ngClass]="variant === 'dashboard'
    ? 'bg-bosla-primary shadow-md'
    : (isSolidBackground
      ? 'bg-bosla-primary/95 backdrop-blur-md border-b border-white/10 shadow-lg'
      : 'bg-transparent border-transparent')">
  <div class="container mx-auto px-4 h-20 flex items-center justify-between">
    <a [routerLink]="navigationService.homeRoute" class="flex items-center gap-2 group">
      <ui-logo size="lg"></ui-logo>
    </a>
    <app-main-navigation />
    <app-header-actions />
    <app-mobile-menu />
  </div>
</header>
