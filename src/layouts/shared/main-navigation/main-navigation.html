<style>
  @keyframes cta-glow {
    0%, 100% { box-shadow: 0 0 12px rgba(243, 156, 18, 0.3); transform: scale(1); }
    50% { box-shadow: 0 0 24px rgba(243, 156, 18, 0.6); transform: scale(1.04); }
  }
  @keyframes cta-pulse-ring {
    0% { opacity: 0.6; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.3); }
  }
  .nav-cta {
    animation: cta-glow 2s ease-in-out infinite;
    position: relative;
  }
  .nav-cta::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 999px;
    border: 2px solid rgba(243, 156, 18, 0.5);
    animation: cta-pulse-ring 2s ease-out infinite;
  }
  .nav-cta:hover {
    animation: none;
    transform: scale(1.05);
  }
</style>

<nav class="hidden md:flex items-center gap-8 font-bold text-white/90">
  @for (link of links(); track link.route) {
    @if (link.cta) {
      <a [routerLink]="link.route"
        class="nav-cta flex items-center gap-2 ps-5 pe-6 py-2 rounded-full bg-linear-to-l from-bosla-orange to-amber-400 text-white text-sm font-bold shadow-lg shadow-bosla-orange/30 hover:shadow-bosla-orange/50 transition-all duration-300">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 19 21 12 17 5 21 12 2" />
        </svg>
        {{ link.label }}
      </a>
    } @else {
      <a [routerLink]="link.route" routerLinkActive="text-bosla-orange"
        [routerLinkActiveOptions]="{ exact: link.route === '/' }"
        class="hover:text-bosla-orange transition-colors">{{ link.label }}</a>
    }
  }
</nav>
