<nav class="hidden md:flex items-center gap-8 font-bold text-white/90">
  @for (link of links(); track link.route) {
    <a [routerLink]="link.route" routerLinkActive="text-bosla-orange"
      [routerLinkActiveOptions]="{ exact: link.route === '/' }"
      class="hover:text-bosla-orange transition-colors">{{ link.label }}</a>
  }
</nav>
