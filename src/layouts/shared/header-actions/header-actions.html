<div class="flex items-center gap-4">
  @if (!authService.isAuthenticated()) {
    <a [routerLink]="navigationService.loginRoute"
      class="hidden md:block font-bold text-white hover:text-bosla-orange transition-colors">
      تسجيل الدخول
    </a>
    <a [routerLink]="navigationService.registerRoute"
      class="px-6 py-2.5 rounded-full bg-bosla-orange hover:bg-orange-500 text-white font-bold shadow-md hover:shadow-lg transition-all active:scale-95">
      ابدأ الآن
    </a>
  } @else {
    <a [routerLink]="navigationService.chatRoute" class="relative text-white hover:text-bosla-orange transition-colors cursor-pointer w-10 h-10 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10" title="الرسائل">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <span class="absolute top-1 right-1 flex h-3 w-3">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-bosla-orange opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-bosla-orange"></span>
      </span>
    </a>

    <a [routerLink]="navigationService.notificationsRoute" class="relative text-white hover:text-bosla-orange transition-colors cursor-pointer w-10 h-10 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10" title="الإشعارات">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="absolute top-1 right-1 flex h-3 w-3">
        <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
      </span>
    </a>

    <app-user-dropdown />
  }
</div>
