@if (isOpen()) {
<div class="ntf-dropdown">
  <div class="ntf-dropdown-header">
    <h3>الإشعارات</h3>
    @if (unreadCount() > 0) {
    <span class="ntf-dropdown-badge">{{ unreadCount() }}</span>
    }
  </div>

  <div class="ntf-dropdown-body">
    @if (latest.length === 0) {
    <div class="ntf-dropdown-empty">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#95A5A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <p>لا توجد إشعارات</p>
    </div>
    }

    @for (notif of latest; track notif.id) {
    <div class="ntf-dropdown-item" [class.ntf-dropdown-item-unread]="!notif.isRead" (click)="markAsRead(notif.id, $event)">
      <div class="ntf-dropdown-icon" [class.ntf-dropdown-icon-unread]="!notif.isRead" [class.ntf-dropdown-icon-read]="notif.isRead">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </div>
      <div class="ntf-dropdown-text">
        <p class="ntf-dropdown-title">{{ notif.title }}</p>
        <p class="ntf-dropdown-msg">{{ notif.message }}</p>
      </div>
      @if (!notif.isRead) {
      <div class="ntf-dropdown-dot"></div>
      }
    </div>
    }
  </div>

  <a [routerLink]="notifRoute" class="ntf-dropdown-footer" (click)="close.emit()">
    عرض كل الإشعارات
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </a>
</div>
}
