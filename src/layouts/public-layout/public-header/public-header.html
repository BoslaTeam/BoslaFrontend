<header class="fixed top-0 left-0 w-full z-50 transition-all duration-300"
  [ngClass]="isScrolled ? 'bg-charcoal/90 backdrop-blur-md border-b border-white/10 shadow-lg' : 'bg-transparent border-transparent'">
  <div class="container mx-auto px-4 h-20 flex items-center justify-between">
    <!-- Logo -->
    <a href="/" class="flex items-center gap-2 group">
      <span class="text-2xl font-black tracking-tight text-white">بوصلة<span class="text-burgundy">.</span></span>
    </a>

    <!-- Navigation -->
    <nav class="hidden md:flex items-center gap-8 font-medium text-white/80">
      <a href="#" class="hover:text-gold transition-colors">الرئيسية</a>
      <a href="#" class="hover:text-gold transition-colors">المتخصصين</a>
      <a href="#" class="hover:text-gold transition-colors">من نحن</a>
      <a href="#" class="hover:text-gold transition-colors">اتصل بنا</a>
    </nav>

    <!-- Actions -->
    <div class="flex items-center gap-4">
      <ng-container *ngIf="!authService.isAuthenticated()">
        <a routerLink="/auth/login" class="hidden md:block font-medium text-white hover:text-gold transition-colors">
          تسجيل الدخول
        </a>
        <a routerLink="/auth/register" class="px-6 py-2.5 rounded-full bg-burgundy hover:bg-burgundy-dark text-white font-semibold shadow-md hover:shadow-lg transition-all active:scale-95">
          ابدأ الآن
        </a>
      </ng-container>

      <ng-container *ngIf="authService.isAuthenticated()">
        <button (click)="authService.logout()" class="px-6 py-2.5 rounded-full bg-charcoal hover:bg-charcoal-light text-white font-semibold shadow-md hover:shadow-lg transition-all active:scale-95 border border-white/20">
          تسجيل الخروج
        </button>
      </ng-container>
    </div>
  </div>
</header>
