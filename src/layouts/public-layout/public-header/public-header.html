<header class="fixed top-0 left-0 w-full z-50 transition-all duration-300"
  [ngClass]="isScrolled ? 'bg-bosla-primary/95 backdrop-blur-md border-b border-white/10 shadow-lg' : 'bg-transparent border-transparent'">
  <div class="container mx-auto px-4 h-20 flex items-center justify-between">
    <!-- Logo -->
    <a href="/" class="flex items-center gap-2 group">
      <ui-logo size="md"></ui-logo>
    </a>

    <!-- Navigation -->
    <nav class="hidden md:flex items-center gap-8 font-bold text-white/90">
      <a href="#" class="hover:text-bosla-orange transition-colors">الرئيسية</a>
      <a routerLink="/specialists" routerLinkActive="text-bosla-orange"
        class="hover:text-bosla-orange transition-colors">المتخصصين</a>
      <a href="#" class="hover:text-bosla-orange transition-colors">من نحن</a>
      <a href="#" class="hover:text-bosla-orange transition-colors">اتصل بنا</a>
    </nav>

    <!-- Actions -->
    <div class="flex items-center gap-4">
      <ng-container *ngIf="!authService.isAuthenticated()">
        <a routerLink="/auth/login"
          class="hidden md:block font-bold text-white hover:text-bosla-orange transition-colors">
          تسجيل الدخول
        </a>
        <a routerLink="/auth/register"
          class="px-6 py-2.5 rounded-full bg-bosla-orange hover:bg-orange-500 text-white font-bold shadow-md hover:shadow-lg transition-all active:scale-95">
          ابدأ الآن
        </a>
      </ng-container>

      <ng-container *ngIf="authService.isAuthenticated()">
        <!-- Profile Icon -->
        <a [routerLink]="dashboardRoute" title="الملف الشخصي"
          class="flex items-center justify-center w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white transition-all shadow-sm border border-white/10 hover:border-white/30 overflow-hidden">
          
          @if (authService.currentUser()?.avatarUrl && !avatarError) {
            <img [src]="authService.currentUser()?.avatarUrl" alt="Profile" class="w-full h-full object-cover" (error)="onAvatarError()">
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          }
        </a>

        <button (click)="authService.logout()"
          class="px-6 py-2.5 rounded-full bg-bosla-charcoal hover:bg-slate-700 text-white font-semibold shadow-md hover:shadow-lg transition-all active:scale-95 border border-white/20">
          تسجيل الخروج
        </button>
      </ng-container>
    </div>
  </div>
</header>
