<header class="fixed top-0 left-0 w-full z-50 transition-all duration-300"
  [ngClass]="isSolidBackground ? 'bg-bosla-primary/95 backdrop-blur-md border-b border-white/10 shadow-lg' : 'bg-transparent border-transparent'">
  <div class="container mx-auto px-4 h-20 flex items-center justify-between">
    <!-- Logo -->
    <a href="/" class="flex items-center gap-2 group">
      <ui-logo size="md"></ui-logo>
    </a>

    <!-- Navigation -->
    <nav class="hidden md:flex items-center gap-8 font-bold text-white/90">
      <a routerLink="/" routerLinkActive="text-bosla-orange" [routerLinkActiveOptions]="{ exact: true }"
        class="hover:text-bosla-orange transition-colors">الرئيسية</a>

      <a routerLink="/specialists" routerLinkActive="text-bosla-orange"
        class="hover:text-bosla-orange transition-colors">المتخصصين</a>

      <a routerLink="" class="hover:text-bosla-orange transition-colors">من نحن</a>

      <a routerLink="" class="hover:text-bosla-orange transition-colors">اتصل بنا</a>
    </nav>

    <!-- Actions -->
    <div class="flex items-center gap-4">
      <ng-container *ngIf="!authService.isAuthenticated()">
        <a routerLink="/auth/login"
          class="hidden md:block font-bold text-white hover:text-bosla-orange transition-colors">
          تسجيل الدخول
        </a>
        <a routerLink="/auth/register"
          class="px-6 py-2.5 rounded-full bg-bosla-orange hover:bg-orange-500 text-white font-bold shadow-md hover:shadow-lg transition-all active:scale-95">
          ابدأ الآن
        </a>
      </ng-container>

      <ng-container *ngIf="authService.isAuthenticated()">
        
        <!-- Messages Icon -->
        <a routerLink="/user/chat" class="relative text-white hover:text-bosla-orange transition-colors cursor-pointer w-10 h-10 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10" title="الرسائل">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span class="absolute top-1 right-1 flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-bosla-orange opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-bosla-orange"></span>
          </span>
        </a>

        <!-- Notifications Icon -->
        <a routerLink="/user/notifications" class="relative text-white hover:text-bosla-orange transition-colors cursor-pointer w-10 h-10 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10" title="الإشعارات">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="absolute top-1 right-1 flex h-3 w-3">
            <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
          </span>
        </a>

        <!-- User Dropdown Container -->
        <div class="relative user-dropdown-container">
          <!-- Profile Button -->
          <button (click)="toggleDropdown()" title="قائمة المستخدم"
            class="flex items-center justify-center w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white transition-all shadow-sm border border-white/10 hover:border-white/30 overflow-hidden cursor-pointer focus:outline-none">
            
            @if (authService.currentUser()?.avatarUrl && !avatarError) {
              <img [src]="authService.currentUser()?.avatarUrl" alt="Profile" class="w-full h-full object-cover"
                (error)="onAvatarError()">
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            }
          </button>

          <!-- Dropdown Menu -->
          <div *ngIf="isDropdownOpen()" 
               class="absolute left-0 mt-3 w-56 bg-white rounded-xl shadow-2xl py-2 z-50 border border-slate-100 flex flex-col transform origin-top-left transition-all duration-200">
            
            <!-- User Info Header -->
            <div class="px-4 py-3 border-b border-slate-100">
              <p class="text-sm font-bold text-slate-800 truncate">{{ authService.currentUser()?.fullName || 'مستخدم' }}</p>
              <p class="text-xs text-slate-500 truncate mt-0.5">{{ authService.currentUser()?.email || '' }}</p>
            </div>

            <!-- Links -->
            <a routerLink="/user/profile" (click)="closeDropdown()" class="px-4 py-2.5 text-sm text-slate-600 hover:text-bosla-primary hover:bg-slate-50 flex items-center gap-3 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              الإعدادات والملف الشخصي
            </a>
            
            <a routerLink="/user/appointments" (click)="closeDropdown()" class="px-4 py-2.5 text-sm text-slate-600 hover:text-bosla-primary hover:bg-slate-50 flex items-center gap-3 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              سجل الحجوزات
            </a>

            <a routerLink="/user/video" (click)="closeDropdown()" class="px-4 py-2.5 text-sm text-slate-600 hover:text-bosla-primary hover:bg-slate-50 flex items-center gap-3 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
              جلسات الفيديو
            </a>

            <a routerLink="/user/payments" (click)="closeDropdown()" class="px-4 py-2.5 text-sm text-slate-600 hover:text-bosla-primary hover:bg-slate-50 flex items-center gap-3 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
              المعاملات المالية
            </a>

            <div class="h-px bg-slate-100 my-1"></div>

            <!-- Logout -->
            <button (click)="authService.logout(); closeDropdown()"
              class="w-full text-right px-4 py-2.5 text-sm font-semibold text-red-500 hover:bg-red-50 hover:text-red-600 flex items-center gap-3 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
              تسجيل الخروج
            </button>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</header>
